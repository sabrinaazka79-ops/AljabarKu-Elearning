<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatematikaKu — E-Learning Matematika SMP Kelas VIII</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --brand:#4f46e5; --brand-2:#6366f1; --brand-soft:#eef2ff; --brand-ink:#3730a3;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#b45309; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
  --info:#0284c7; --info-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.18);
  --radius:14px; --radius-sm:10px;
  --font:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#121829; --surface-2:#171f33; --border:#26304a; --border-strong:#38445f;
    --text:#e8edf7; --text-2:#a8b4cd; --text-3:#7b88a3;
    --brand:#818cf8; --brand-2:#a5b4fc; --brand-soft:#1e2340; --brand-ink:#c7d2fe;
    --ok:#34d399; --ok-soft:#0d3a2e; --warn:#fbbf24; --warn-soft:#3a2c08; --bad:#f87171; --bad-soft:#3b1414;
    --info:#38bdf8; --info-soft:#0c2a3d;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121829; --surface-2:#171f33; --border:#26304a; --border-strong:#38445f;
  --text:#e8edf7; --text-2:#a8b4cd; --text-3:#7b88a3;
  --brand:#818cf8; --brand-2:#a5b4fc; --brand-soft:#1e2340; --brand-ink:#c7d2fe;
  --ok:#34d399; --ok-soft:#0d3a2e; --warn:#fbbf24; --warn-soft:#3a2c08; --bad:#f87171; --bad-soft:#3b1414;
  --info:#38bdf8; --info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.015em}
p{margin:0 0 .7em}
.mono{font-family:var(--mono)}

/* ---------- Layout ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:256px;flex:0 0 256px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:0 0 auto}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nav{padding:6px 10px 16px;overflow-y:auto;flex:1}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;margin-bottom:2px;border:0;background:none;
  border-radius:var(--radius-sm);cursor:pointer;color:var(--text-2);font-weight:600;font-size:14px;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-ink)}
.nav-item .ic{width:18px;text-align:center;flex:0 0 18px;font-size:15px}
.nav-item .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav-item.locked{opacity:.42;cursor:not-allowed}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.userbox{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.crumb{font-size:12.5px;color:var(--text-3);font-weight:600}
.page-title{font-size:19px;font-weight:800}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 24px 60px;max-width:1180px;width:100%}
.menu-toggle{display:none}

/* ---------- Components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:15.5px;font-weight:700}
.card-head .sub{font-size:12.5px;color:var(--text-3);font-weight:500}
.card-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 320px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:650;font-size:13.5px;
  cursor:pointer;transition:transform .08s,background .15s,border-color .15s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-danger{background:transparent;border-color:var(--border-strong);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.field .hint{font-size:11.5px;color:var(--text-3);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2);
  outline:none;transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
textarea{min-height:92px;resize:vertical;line-height:1.55}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-brand{background:var(--brand-soft);color:var(--brand-ink)}
.b-mute{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);
  padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:700}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}

.stat{padding:16px 18px}
.stat .lbl{font-size:12px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .val{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.stat .cap{font-size:12px;color:var(--text-2)}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.bar.ok>span{background:linear-gradient(90deg,var(--ok),#10b981)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-weight:650;font-size:13.5px;color:var(--text-2);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}

.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45);animation:pop .16s ease-out}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{font-size:16px;font-weight:750}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}

#toast-root{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);
  border-radius:11px;padding:11px 15px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;max-width:330px;
  animation:pop .16s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}

.empty{text-align:center;padding:42px 18px;color:var(--text-3)}
.empty .ico{font-size:34px;margin-bottom:8px}

/* Materi reader */
.reader{display:grid;grid-template-columns:262px minmax(0,1fr);gap:18px;align-items:start}
.toc{position:sticky;top:78px}
.toc-item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:9px;
  cursor:pointer;font-size:13.2px;color:var(--text-2);font-weight:600;line-height:1.35}
.toc-item:hover{background:var(--surface-2)}
.toc-item.active{background:var(--brand-soft);color:var(--brand-ink)}
.toc-bab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:12px 11px 5px}
.prose{font-size:15px;line-height:1.75;color:var(--text)}
.prose h4{margin:22px 0 8px;font-size:15.5px;font-weight:750}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin-bottom:5px}
.formula{font-family:var(--mono);background:var(--surface-2);border:1px dashed var(--border-strong);
  border-radius:10px;padding:11px 14px;margin:12px 0;font-size:14px;text-align:center;overflow-x:auto;white-space:nowrap}
.callout{border-radius:12px;padding:13px 15px;margin:14px 0;font-size:13.8px;border:1px solid}
.callout.tip{background:var(--brand-soft);border-color:transparent;color:var(--text)}
.callout.warn{background:var(--warn-soft);border-color:transparent;color:var(--text)}
.pager{display:flex;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.pager .btn{flex:1;justify-content:space-between;text-align:left;padding:12px 15px}
.pager small{display:block;font-size:11px;color:var(--text-3);font-weight:700;letter-spacing:.05em;text-transform:uppercase}

/* LKPD steps */
.stepline{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
  font-size:11.8px;font-weight:700;color:var(--text-3);cursor:pointer;text-align:left}
.step.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.step.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.step .n{display:block;font-size:10px;letter-spacing:.08em;opacity:.85}

.q{border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:12px;background:var(--surface)}
.q-num{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.05em;text-transform:uppercase}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
  margin-bottom:7px;cursor:pointer;background:var(--surface-2)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:3px;flex:0 0 auto;width:auto}

.ai-box{border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:11px;background:var(--surface-2);padding:12px 14px;margin-top:9px}
.ai-title{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:5px;display:flex;gap:7px;align-items:center}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text-2)}
.conf .bar{width:64px;height:6px}

.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2);font-size:12px;font-weight:650;cursor:pointer}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

.switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border-strong);border-radius:999px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--brand)}
.switch input:checked + .slider:before{transform:translateX(18px)}

/* Login */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-art{background:linear-gradient(150deg,#4338ca,#6366f1 55%,#0ea5e9);color:#fff;padding:48px;display:flex;
  flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login-art h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.login-art p{opacity:.92;max-width:430px;font-size:15px}
.login-art .feat{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;opacity:.95}
.blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.18;background:#fff}
.login-form{display:flex;align-items:center;justify-content:center;padding:36px 24px;background:var(--surface)}
.login-card{width:100%;max-width:400px}
.role-pick{display:grid;gap:8px;margin-bottom:6px}
.role-btn{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--border-strong);border-radius:12px;
  background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.role-btn:hover{border-color:var(--brand)}
.role-btn.on{border-color:var(--brand);background:var(--brand-soft)}
.role-btn .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--surface);flex:0 0 auto}
.role-btn .t{font-weight:750;font-size:14px}
.role-btn .d{font-size:12px;color:var(--text-3)}

@media (max-width:1040px){ .g-side,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .reader{grid-template-columns:1fr} .toc{position:static} }
@media (max-width:880px){
  .login-wrap{grid-template-columns:1fr} .login-art{display:none}
  .sidebar{position:fixed;z-index:60;left:0;top:0;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .menu-toggle{display:inline-flex}
  .content{padding:18px 15px 60px}
  .topbar{padding:11px 15px}
  .g2,.g3,.g4,.g-side{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55}
}
@media print{ .sidebar,.topbar{display:none} }
</style>
</head>

    materi: [
      {id:'m-1', bab:'Bab 1 — Relasi', judul:'Pengertian Relasi', urut:1, terbit:true, isi:`
<p>Dalam kehidupan sehari-hari kita sering menghubungkan anggota satu kelompok dengan anggota kelompok lain, misalnya siswa dengan mata pelajaran favoritnya. Hubungan seperti ini disebut <b>relasi</b>.</p>
<div class="callout tip"><b>Definisi:</b> relasi dari himpunan <span class="mono">A</span> ke himpunan <span class="mono">B</span> adalah aturan yang memasangkan anggota-anggota <span class="mono">A</span> dengan anggota-anggota <span class="mono">B</span>.</div>
<h4>Istilah penting</h4>
<ul>
<li><b>Daerah asal (domain)</b> — himpunan <span class="mono">A</span>, tempat pasangan dimulai.</li>
<li><b>Daerah kawan (kodomain)</b> — himpunan <span class="mono">B</span>, tempat pasangan berakhir.</li>
<li><b>Daerah hasil (range)</b> — anggota <span class="mono">B</span> yang benar-benar mendapat pasangan dari <span class="mono">A</span>.</li>
</ul>
<h4>Contoh</h4>
<p>Diketahui <span class="mono">A = {2, 3, 4}</span> dan <span class="mono">B = {4, 6, 8, 9}</span>. Relasi &ldquo;faktor dari&rdquo; dari <span class="mono">A</span> ke <span class="mono">B</span> menghasilkan pasangan berikut.</p>
<div class="formula">2 &rarr; 4, 6, 8 &nbsp;|&nbsp; 3 &rarr; 6, 9 &nbsp;|&nbsp; 4 &rarr; 4, 8</div>
<p>Pada relasi ini, ada anggota <span class="mono">A</span> yang berpasangan dengan lebih dari satu anggota <span class="mono">B</span>. Hal itu diperbolehkan untuk sebuah relasi.</p>`},
      {id:'m-2', bab:'Bab 1 — Relasi', judul:'Menyajikan Relasi', urut:2, terbit:true, isi:`
<p>Sebuah relasi dapat disajikan dengan tiga cara. Ketiganya menyampaikan informasi yang sama, hanya bentuknya berbeda.</p>
<h4>Contoh relasi &ldquo;setengah dari&rdquo;</h4>
<p>Dari <span class="mono">A = {1, 2, 3}</span> ke <span class="mono">B = {2, 4, 6}</span>.</p>
<h4>1. Diagram panah</h4>
<p>Anggota <span class="mono">A</span> dan <span class="mono">B</span> ditulis dalam dua lingkaran, lalu dihubungkan dengan anak panah.</p>
<div class="formula">1 &rarr; 2 &nbsp;|&nbsp; 2 &rarr; 4 &nbsp;|&nbsp; 3 &rarr; 6</div>
<h4>2. Himpunan pasangan berurutan</h4>
<p>Setiap pasangan ditulis dalam bentuk <span class="mono">(a, b)</span> dengan <span class="mono">a</span> dari <span class="mono">A</span> dan <span class="mono">b</span> dari <span class="mono">B</span>.</p>
<div class="formula">{(1, 2), (2, 4), (3, 6)}</div>
<h4>3. Diagram Cartesius</h4>
<p>Anggota <span class="mono">A</span> diletakkan pada sumbu mendatar dan anggota <span class="mono">B</span> pada sumbu tegak. Setiap pasangan digambar sebagai sebuah titik: <span class="mono">(1, 2)</span>, <span class="mono">(2, 4)</span>, dan <span class="mono">(3, 6)</span>.</p>
<div class="callout warn"><b>Kesalahan umum:</b> urutan pasangan berpengaruh. <span class="mono">(1, 2)</span> tidak sama dengan <span class="mono">(2, 1)</span>.</div>`},
      {id:'m-3', bab:'Bab 2 — Fungsi', judul:'Pengertian Fungsi', urut:3, terbit:true, isi:`
<p><b>Fungsi</b> adalah relasi khusus dari himpunan <span class="mono">A</span> ke himpunan <span class="mono">B</span>. Setiap anggota <span class="mono">A</span> harus memiliki <b>tepat satu</b> pasangan di <span class="mono">B</span>.</p>
<h4>Dua syarat sebuah relasi disebut fungsi</h4>
<ol>
<li>Semua anggota <span class="mono">A</span> mempunyai pasangan di <span class="mono">B</span>.</li>
<li>Setiap anggota <span class="mono">A</span> hanya berpasangan dengan satu anggota <span class="mono">B</span>.</li>
</ol>
<h4>Contoh untuk A = {1, 2, 3} dan B = {a, b}</h4>
<div class="formula">{(1, a), (2, a), (3, b)} &nbsp; merupakan fungsi</div>
<div class="formula">{(1, a), (1, b), (2, b), (3, b)} &nbsp; bukan fungsi</div>
<div class="formula">{(1, a), (2, b)} &nbsp; bukan fungsi</div>
<p>Contoh kedua bukan fungsi karena anggota <span class="mono">1</span> punya dua pasangan. Contoh ketiga bukan fungsi karena anggota <span class="mono">3</span> tidak punya pasangan.</p>
<div class="callout tip">Dua anggota <span class="mono">A</span> boleh berpasangan dengan anggota <span class="mono">B</span> yang sama, seperti <span class="mono">1</span> dan <span class="mono">2</span> yang sama-sama berpasangan dengan <span class="mono">a</span>. Yang tidak boleh adalah satu anggota <span class="mono">A</span> mempunyai dua pasangan.</div>`},
      {id:'m-4', bab:'Bab 2 — Fungsi', judul:'Domain, Kodomain, Range, dan Banyak Pemetaan', urut:4, terbit:true, isi:`
<p>Pada fungsi <span class="mono">f : A &rarr; B</span> kita memakai tiga istilah berikut.</p>
<ul>
<li><b>Domain</b> — daerah asal, yaitu seluruh anggota <span class="mono">A</span>.</li>
<li><b>Kodomain</b> — daerah kawan, yaitu seluruh anggota <span class="mono">B</span>.</li>
<li><b>Range</b> — daerah hasil, yaitu anggota <span class="mono">B</span> yang menjadi pasangan anggota <span class="mono">A</span>.</li>
</ul>
<div class="formula">f = {(1, a), (2, a), (3, b)} &rarr; range = {a, b}</div>
<h4>Banyak pemetaan (fungsi) dari A ke B</h4>
<div class="formula">banyak pemetaan = n(B)<sup>n(A)</sup></div>
<p>Untuk <span class="mono">n(A) = 2</span> dan <span class="mono">n(B) = 3</span>, banyak pemetaan dari <span class="mono">A</span> ke <span class="mono">B</span> adalah <span class="mono">3&sup2; = 9</span>. Banyak pemetaan dari <span class="mono">B</span> ke <span class="mono">A</span> adalah <span class="mono">2&sup3; = 8</span>.</p>
<div class="callout warn"><b>Kesalahan umum:</b> membalik pangkat dan bilangan pokoknya. Bilangan pokok adalah banyak anggota <b>kodomain</b>, sedangkan pangkatnya adalah banyak anggota <b>domain</b>.</div>`},
      {id:'m-5', bab:'Bab 2 — Fungsi', judul:'Notasi dan Nilai Fungsi', urut:5, terbit:true, isi:`
<p>Fungsi sering ditulis dengan rumus. Notasi <span class="mono">f(x)</span> dibaca &ldquo;f dari x&rdquo; dan menyatakan nilai fungsi <span class="mono">f</span> untuk masukan <span class="mono">x</span>.</p>
<div class="formula">f(x) = 2x + 3</div>
<h4>Menghitung nilai fungsi</h4>
<p>Ganti <span class="mono">x</span> dengan nilai yang diminta.</p>
<div class="formula">f(4) = 2(4) + 3 = 11</div>
<div class="formula">f(&minus;1) = 2(&minus;1) + 3 = 1</div>
<h4>Mencari x jika nilai fungsinya diketahui</h4>
<p>Jika <span class="mono">f(a) = 9</span>, maka:</p>
<div class="formula">2a + 3 = 9 &rarr; 2a = 6 &rarr; a = 3</div>
<h4>Menentukan rumus fungsi linear f(x) = ax + b</h4>
<p>Diketahui <span class="mono">f(1) = 5</span> dan <span class="mono">f(3) = 11</span>.</p>
<ol>
<li>Dari <span class="mono">f(1) = 5</span> diperoleh <span class="mono">a + b = 5</span>.</li>
<li>Dari <span class="mono">f(3) = 11</span> diperoleh <span class="mono">3a + b = 11</span>.</li>
<li>Kurangkan kedua persamaan: <span class="mono">2a = 6</span>, sehingga <span class="mono">a = 3</span> dan <span class="mono">b = 2</span>.</li>
</ol>
<div class="formula">f(x) = 3x + 2</div>
<div class="callout tip">Periksa kembali: <span class="mono">f(1) = 3 + 2 = 5</span> dan <span class="mono">f(3) = 9 + 2 = 11</span> &#10003;</div>`},
      {id:'m-6', bab:'Bab 3 — Grafik Fungsi', judul:'Menggambar Grafik Fungsi Linear', urut:6, terbit:false, isi:`
<p>Grafik fungsi dibuat dengan menggambar pasangan <span class="mono">(x, f(x))</span> pada bidang Cartesius.</p>
<h4>Langkah menggambar grafik f(x) = 2x &minus; 1</h4>
<ol>
<li>Buat tabel nilai untuk beberapa nilai <span class="mono">x</span>.</li>
<li>Gambar tiap pasangan sebagai titik pada bidang Cartesius.</li>
<li>Hubungkan titik-titik tersebut dengan garis lurus.</li>
</ol>
<div class="formula">x = &minus;1, 0, 1, 2, 3 &rarr; f(x) = &minus;3, &minus;1, 1, 3, 5</div>
<p>Titik-titik yang diperoleh: <span class="mono">(&minus;1, &minus;3)</span>, <span class="mono">(0, &minus;1)</span>, <span class="mono">(1, 1)</span>, <span class="mono">(2, 3)</span>, dan <span class="mono">(3, 5)</span>.</p>
<h4>Titik potong dengan sumbu</h4>
<p>Dengan sumbu y: <span class="mono">x = 0</span> sehingga titiknya <span class="mono">(0, &minus;1)</span>. Dengan sumbu x: <span class="mono">f(x) = 0</span>, yaitu <span class="mono">2x &minus; 1 = 0</span> sehingga <span class="mono">x = &frac12;</span>.</p>
<div class="callout tip">Dua titik sudah cukup untuk menggambar garis lurus, tetapi menambah satu titik ketiga berguna untuk memeriksa ketelitianmu.</div>`}
    ],

/* Penyimpanan: semua data (kecuali akun) disimpan di tabel Supabase `app_data`.
   - KOLOM_PETA : objek berkunci, satu baris per kunci (kiriman siswa, penanda notifikasi)
   - KOLOM_SATU : disimpan utuh dalam satu baris
   - KOLOM_LOKAL: tidak disimpan di app_data (akun diambil dari tabel `profiles`)
   - sisanya    : array, satu baris per item (wajib punya `id`) */
const KOLOM_PETA = ['kiriman','notifBaca'];
const KOLOM_SATU = ['log','perms','aturan','meta'];
const KOLOM_LOKAL = ['users'];
let SNAP = {}, _siap = false, _timer = null, _sedang = false, _ulang = false;

function _jadiBaris(){
  const rows = [];
  for(const [col,val] of Object.entries(DB)){
    if(KOLOM_LOKAL.includes(col)) continue;
    if(KOLOM_SATU.includes(col)){ rows.push({collection:col, id:'_', urut:0, data:{v:val}}); continue; }
    if(KOLOM_PETA.includes(col)){
      for(const [k,v] of Object.entries(val||{})) rows.push({collection:col, id:k, urut:0, data:v});
      continue;
    }
    if(Array.isArray(val)){
      val.forEach((it,i)=>{ if(it && typeof it==='object'){ if(!it.id) it.id=uid('x'); rows.push({collection:col, id:String(it.id), urut:i, data:it}); } });
    }
  }
  return rows;
}
const _sig = r => JSON.stringify(r.data)+'#'+r.urut;
function _rekamSnap(){
  SNAP = {};
  for(const r of _jadiBaris()) (SNAP[r.collection] ||= {})[r.id] = _sig(r);
}

function _gabung(p){
  const dasar = seed(), users = DB.users;
  DB = Object.assign(dasar, p);
  DB.users = users;
  DB.aturan = Object.assign(seed().aturan, p.aturan||{});
  const dp = seed().perms;
  DB.perms = {
    admin: Object.assign(dp.admin, (p.perms||{}).admin||{}),
    guru: Object.assign(dp.guru, (p.perms||{}).guru||{}),
    siswa: Object.assign(dp.siswa, (p.perms||{}).siswa||{})
  };
  ['absensi','diskusi','umpanBalik'].forEach(x=>{ if(!Array.isArray(DB[x])) DB[x]=[]; });
}

    if(raw){ const p = JSON.parse(raw); if(p){ ['users','meta','materi','lkpd','latihan','evaluasi','pengumuman','absensi','diskusi','kiriman','umpanBalik','notifBaca'].forEach(k=>delete p[k]); _gabung(p); } }

   Akun, kelas, pengaturan, dan hak akses tidak disentuh. */
function _terapkanKontenBaru(){
  const b = seed();
  const kid = (DB.kelas && DB.kelas[0] && DB.kelas[0].id) || 'k-1';
  ['materi','lkpd','latihan','evaluasi','pengumuman','absensi','diskusi'].forEach(k=>{
    DB[k] = b[k].map(it => it.kelas ? Object.assign({}, it, {kelas: kid}) : it);
  });
  DB.kiriman = {}; DB.umpanBalik = []; DB.notifBaca = {};
  const nama = {'VII-A Matematika':'VIII-A Matematika','VII-B Matematika':'VIII-B Matematika'};
  const kode = {'ALJ-7A':'MTK-8A','ALJ-7B':'MTK-8B'};
  (DB.kelas||[]).forEach(k=>{
    if(nama[k.nama]) k.nama = nama[k.nama];
    if(kode[k.kode]) k.kode = kode[k.kode];
    if(/aljabar/i.test(k.deskripsi||'')) k.deskripsi = 'Kelas relasi dan fungsi untuk siswa kelas VIII semester ganjil.';
  });
  if(DB.aturan && /aljabar/i.test(DB.aturan.aiRubrik||'')) DB.aturan.aiRubrik = seed().aturan.aiRubrik;

}

async function muat(){
  _siap = false; SNAP = {};
  const {data, error} = await sb.from('app_data').select('collection,id,urut,data').order('urut');
  if(error){ console.error('Muat data gagal:', error.message); toast('Gagal memuat data: '+error.message,'bad'); return false; }
  if(!data.length){
    if(S.user && (S.user.role==='admin' || S.user.role==='guru')){
      _muatLokalLama(); _siap = true; await _kirim();
      toast('Data awal diunggah ke Supabase.','ok');
    } else {
      toast('Data kelas belum disiapkan. Minta guru atau admin masuk sekali terlebih dahulu.','warn');
    }
    return true;
  }
  const p = {}, awal = seed();
  for(const r of data){
    if(KOLOM_SATU.includes(r.collection)) p[r.collection] = r.data.v;
    else if(KOLOM_PETA.includes(r.collection)) (p[r.collection] ||= {})[r.id] = r.data;
    else (p[r.collection] ||= []).push(r.data);
  }
  // koleksi yang sengaja dikosongkan jangan kembali ke data contoh
  for(const k of Object.keys(awal)){
    if(KOLOM_LOKAL.includes(k) || KOLOM_SATU.includes(k) || k in p) continue;
    p[k] = Array.isArray(awal[k]) ? [] : {};
  }
  const metaLama = p.meta;
  _gabung(p);
  DB.meta = metaLama || {seedVer:'aljabar-kelas7'};   // sebelum snapshot, supaya siswa tidak ikut menulis baris meta
  _rekamSnap(); _siap = true;
  if(DB.meta.seedVer !== SEED_VER && S.user && (S.user.role==='admin' || S.user.role==='guru')){
    _terapkanKontenBaru();
    await _kirim();
    toast('Materi diperbarui menjadi Relasi dan Fungsi kelas VIII.','ok');
  }
  return true;
}

function simpan(langsung){
  if(!_siap) return;
  clearTimeout(_timer);
  if(langsung===true) return _kirim();
  _timer = setTimeout(_kirim, 300);
}

async function _kirim(){
  if(!_siap) return;
  if(_sedang){ _ulang = true; return; }
  _sedang = true;
  try{
    const rows = _jadiBaris(), baru = {}, ubah = [];
    for(const r of rows){
      const g = _sig(r);
      (baru[r.collection] ||= {})[r.id] = g;
      if(!SNAP[r.collection] || SNAP[r.collection][r.id] !== g) ubah.push(r);
    }
    for(let i=0; i<ubah.length; i+=100){
      const bagian = ubah.slice(i,i+100);
      const {error} = await sb.from('app_data').upsert(bagian, {onConflict:'collection,id'});
      if(error){ error.message = '['+[...new Set(bagian.map(r=>r.collection))].join(', ')+'] '+error.message; throw error; }
    }
    for(const [col,ids] of Object.entries(SNAP)){
      const hapus = Object.keys(ids).filter(id=> !(baru[col] && id in baru[col]));
      for(let i=0; i<hapus.length; i+=100){
        const {error} = await sb.from('app_data').delete().eq('collection',col).in('id', hapus.slice(i,i+100));
        if(error) throw error;
      }
    }
    SNAP = baru;
  }catch(e){
    console.error('Simpan gagal:', e);
    toast('Data gagal disimpan: '+(e.message||e),'bad');
  }finally{
    _sedang = false;
    if(_ulang){ _ulang = false; _kirim(); }
  }
}

let AI = null, AI_SIAP = false;
/* Mesin AI: memakai Claude bawaan bila tersedia; bila tidak, memanggil Edge Function Supabase `koreksi-ai`
   yang meneruskan ke Google Gemini (paket gratis). Kunci API disimpan sebagai secret di server. */
function _urai(teks){
  const t=String(teks||'').replace(/```json|```/g,'').trim();
  try{ return JSON.parse(t); }catch(e){}
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  throw new Error('Balasan AI bukan JSON yang valid.');
}
const AI_SERVER = {
  nama:'Gemini (gratis)',
  async json(prompt){
    const {data, error} = await sb.functions.invoke('koreksi-ai', {body:{prompt}});
    if(error){
      let pesan = error.message;
      try{ const j = await error.context.json(); if(j && j.error) pesan = j.error; }catch(e){}
      throw new Error(pesan);
    }
    if(!data || data.error) throw new Error((data&&data.error)||'Balasan kosong dari server AI.');
    return _urai(data.text);
  }
};
(async ()=>{ try{
  if(window.claude && claude.use){ AI = await claude.use('sample'); AI.nama='Claude (sample)'; AI_SIAP = !!AI; }
  else { AI = AI_SERVER; AI_SIAP = true; }
}catch(e){ AI = AI_SERVER; AI_SIAP = true; } })();
function _galatAI(e){ console.error('Koreksi AI gagal:', e); toast('AI tidak dapat dihubungi ('+(e.message||e)+'). Memakai mesin lokal.','warn'); }

function normal(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/\s+/g,'').replace(/−|–|—/g,'-').replace(/×/g,'*').replace(/·/g,'*')
    .replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.')
    .replace(/\*/g,'').replace(/^x=/,'').replace(/^y=/,'');
}
function urutSuku(s){ // 8b+5a -> 5a+8b (agar urutan tidak memengaruhi penilaian)
  if(!/^[-+0-9a-z^().]+$/.test(s)) return s;
  const t = s.replace(/-/g,'+-').split('+').filter(Boolean).sort();
  return t.join('+');
}
function mirip(a,b){
  const m=a.length, n=b.length; if(!m||!n) return 0;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1 - d[m][n]/Math.max(m,n);
}
/* koreksi lokal — selalu tersedia, dipakai sebagai cadangan bila AI tidak aktif */
function koreksiLokal(soal, jawaban){
  const j = normal(jawaban);
  if(!j) return {skor:0, benar:false, yakin:100, catatan:'Jawaban kosong, tidak ada yang dapat dinilai.'};
  if(soal.tipe==='uraian'){
    const kk = soal.kataKunci||[];
    const hit = kk.filter(k=> j.includes(normal(k)));
    const rasio = kk.length? hit.length/kk.length : 0;
    return {
      skor: Math.round(rasio*soal.skor),
      benar: rasio>=0.8,
      yakin: 48,
      catatan: 'Penilaian uraian berbasis kemunculan unsur kunci ('+hit.length+' dari '+kk.length+' unsur ditemukan). Langkah penyelesaian perlu dibaca guru karena AI belum tentu menangkap alur penalaran siswa.'
    };
  }
  const kandidat = [soal.kunci].concat(soal.alt||[]).map(normal);
  if(kandidat.includes(j)) return {skor:soal.skor, benar:true, yakin:97, catatan:'Jawaban sesuai kunci.'};
  if(kandidat.some(k=> urutSuku(k)===urutSuku(j)))
    return {skor:soal.skor, benar:true, yakin:88, catatan:'Jawaban benar meski urutan suku berbeda dari kunci.'};
  const na=parseFloat(j), nb=parseFloat(normal(soal.kunci));
  if(!isNaN(na)&&!isNaN(nb)&&Math.abs(na-nb)<1e-9)
    return {skor:soal.skor, benar:true, yakin:90, catatan:'Nilai numerik sama dengan kunci.'};
  const sim = Math.max(...kandidat.map(k=>mirip(j,k)));
  if(sim>0.82) return {skor:Math.round(soal.skor*0.5), benar:false, yakin:52,
    catatan:'Jawaban sangat mirip kunci (kemiripan '+Math.round(sim*100)+'%) — kemungkinan salah tulis atau kesalahan tanda. Perlu diperiksa guru.'};
  return {skor:0, benar:false, yakin:84, catatan:'Jawaban berbeda dari kunci. Kunci: '+soal.kunci+'.'};
}
async function koreksiAI(tes, kiriman){
  const A = DB.aturan;
  const hasil = [];
  for(const s of tes.soal){
    const jw = kiriman.jawaban[s.id] || '';
    if(s.tipe==='foto'){
      const ada = !!(kiriman.foto && kiriman.foto[s.id]);
      hasil.push({soalId:s.id, skor:0, benar:false, yakin:30,
        catatan: ada? 'Jawaban berupa foto tulisan tangan. AI tidak menetapkan nilai untuk jenis ini — guru menilai langsung dari gambar.'
                    : 'Tidak ada foto jawaban yang diunggah.'});
      continue;
    }
    const h = Object.assign({soalId:s.id}, koreksiLokal(s, jw));
    if(A.aiKetelitian==='ketat' && h.yakin<95 && !h.benar) h.skor=0;
    if(A.aiKetelitian==='longgar' && !h.benar && h.yakin<70) h.skor=Math.round(s.skor*0.5);
    hasil.push(h);
  }
  if(AI_SIAP){
    try{
      const payload = tes.soal.map((s,i)=>({no:i+1, id:s.id, soal:s.teks, kunci:s.kunci, skorMaks:s.skor,
        jawabanSiswa:kiriman.jawaban[s.id]||'', adaFotoJawaban: !!(kiriman.foto&&kiriman.foto[s.id])}));
      const ketat = {longgar:'Bersikap longgar: beri sebagian nilai untuk langkah yang sudah benar.',
                     sedang:'Bersikap wajar dan proporsional.',
                     ketat:'Bersikap ketat: nilai penuh hanya untuk jawaban yang benar-benar tepat.'}[A.aiKetelitian];
      const out = await AI.json(
        'Kamu adalah asisten korektor matematika tingkat SMP kelas VIII (materi relasi dan fungsi). Nilai setiap jawaban siswa berikut. '+
        'Terima jawaban yang setara meskipun penulisannya berbeda (urutan anggota himpunan, notasi f(x), tanda kali, spasi). '+
        'Untuk soal uraian, nilai kebenaran langkah penyelesaian, bukan hanya jawaban akhir. '+ketat+' '+
        'Rubrik tambahan dari guru: '+(A.aiRubrik||'-')+' '+
        'Balas HANYA JSON: {"hasil":[{"id":"...","skor":angka,"benar":true/false,"yakin":0-100,"catatan":"umpan balik singkat berbahasa Indonesia untuk siswa"}]}. '+
        '"yakin" adalah tingkat keyakinanmu; beri nilai rendah bila jawaban ambigu atau perlu pertimbangan guru.\n\nDATA:\n'+
        JSON.stringify(payload), {modelTier:'default'});
      if(out && Array.isArray(out.hasil)){
        out.hasil.forEach(r=>{
          const t = hasil.find(h=>h.soalId===r.id);
          const s = tes.soal.find(x=>x.id===r.id);
          if(t&&s){ t.skor=Math.max(0,Math.min(s.skor, Number(r.skor)||0)); t.benar=!!r.benar;
                    t.yakin=Math.max(0,Math.min(100,Number(r.yakin)||60)); t.catatan=String(r.catatan||t.catatan); }
        });
        return {hasil, mesin:(AI&&AI.nama)||'AI'};
      }
    }catch(e){ _galatAI(e); }
  }
  return {hasil, mesin:'Mesin koreksi lokal'};
}

function pasangToggleMata(root){
  (root||document).querySelectorAll('[data-mata]').forEach(b=>{

      if(!inp) return;

async function muatProfil(authId){
  const {data:p, error} = await sb.from('profiles').select('*').eq('id', authId).single();
  if(error || !p){ await sb.auth.signOut(); return {galat:'Profil akun tidak ditemukan. Hubungi administrator.'}; }
  if(p.status === 'nonaktif'){ await sb.auth.signOut(); return {galat:'Akun ini dinonaktifkan oleh administrator.'}; }
  const u = {id:p.id, nama:p.nama, email:p.email, role:p.role, status:p.status, nip:p.nip||'-'};
  if(!DB.users.some(x=>x.id===u.id)){ DB.users.push(Object.assign({gabung:today()},u)); simpan(); }
  return {user:u};
}

function pasangLogin(){
  let role='siswa';
  pasangToggleMata();
  document.querySelectorAll('[data-role]').forEach(b=> b.onclick=()=>{
    role=b.dataset.role;
    document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on', x===b));
  });
  const tampilGalat = t => { const e=$('#loginErr'); e.textContent=t; e.style.display='block'; };
  const masuk = async ()=>{
    $('#loginErr').style.display='none';
    const email=$('#em').value.trim(), pw=$('#pw').value;
    if(!email || !pw){ tampilGalat('Email dan kata sandi wajib diisi.'); return; }
    const btn=$('#btnMasuk'); btn.disabled=true; btn.textContent='Memeriksa…';
    const pulih=()=>{ btn.disabled=false; btn.textContent='Masuk'; };
    const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
    if(error){
      tampilGalat(/confirm/i.test(error.message)? 'Email akun ini belum dikonfirmasi.' : 'Email atau kata sandi salah.');
      console.error('Login gagal:', error.message); pulih(); return;
    }
    const r = await muatProfil(data.user.id);
    if(r.galat){ tampilGalat(r.galat); pulih(); return; }
    if(r.user.role!==role){
      await sb.auth.signOut();
      tampilGalat('Akun ini terdaftar sebagai '+r.user.role+', bukan '+role+'. Pilih peran yang sesuai.'); pulih(); return;
    }
    S.user = r.user; S.view = null; await muat(); await sinkronAkun(); render();
    toast('Selamat datang, '+r.user.nama.split(' ')[0]+'!','ok');
  };
  $('#btnMasuk').onclick = masuk;
  $('#pw').onkeydown = e=>{ if(e.key==='Enter') masuk(); };
  $('#em').onkeydown = e=>{ if(e.key==='Enter') masuk(); };
}

  const tutup=()=> root.innerHTML='';
  root.querySelector('[data-x]').onclick=tutup;
  root.querySelector('.modal-back').onclick=e=>{ if(e.target===root.querySelector('.modal-back')) tutup(); };
  return tutup;
}

/* ---------- Akun ke Supabase (lewat Edge Function 'kelola-akun') ---------- */
const adaSb = id => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(id));
async function panggilAkun(aksi, payload){
  const {data, error} = await sb.functions.invoke('kelola-akun', {body:Object.assign({aksi}, payload)});
  if(error){
    let msg = error.message;
    try{ const j = await error.context.json(); if(j && j.error) msg = j.error; }catch(e){}
    throw new Error(msg);
  }
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function sinkronAkun(){
  try{
    const {data, error} = await sb.from('profiles').select('*');
    if(error){ console.error('Sinkron akun gagal:', error.message); return; }
    data.forEach(p=>{
      const f = {nama:p.nama||p.email, email:p.email, role:p.role, status:p.status||'aktif', nip:p.nip||'-'};
      const ada = DB.users.find(x=>x.id===p.id);
      if(ada) Object.assign(ada, f);
      else DB.users.push(Object.assign({id:p.id, gabung:String(p.created_at||today()).slice(0,10)}, f));
    });
    simpan();
  }catch(e){ console.error(e); }
}

    judul: baru?'Tambah Akun Pengguna':'Ubah Data Akun',
    isi:`
      <div class="field"><label>Nama lengkap</label><input id="f-nama" type="text" value="${esc(u.nama)}" placeholder="Contoh: Adinda Putri"></div>
      <div class="grid g2" style="gap:0 14px">
        <div class="field"><label>Email</label><input id="f-email" type="email" value="${esc(u.email)}" placeholder="nama@sekolah.id"></div>
        <div class="field"><label>NIP / NIS</label><input id="f-nip" type="text" value="${esc(u.nip)}"></div>
      </div>
      <div class="grid g2" style="gap:0 14px">
        <div class="field"><label>Peran</label><select id="f-role">
          ${['admin','guru','siswa'].map(r=>`<option value="${r}" ${u.role===r?'selected':''} style="text-transform:capitalize">${r}</option>`).join('')}
        </select></div>
        <div class="field"><label>Status</label><select id="f-status">
          <option value="aktif" ${u.status==='aktif'?'selected':''}>Aktif</option>
          <option value="nonaktif" ${u.status==='nonaktif'?'selected':''}>Nonaktif</option>
        </select></div>
      </div>
      ${baru?`<div class="field"><label>Kata sandi awal</label>${inputMata('f-pw','Buat kata sandi untuk akun ini')}
        <span class="hint">Beri kata sandi yang berbeda untuk setiap akun. Pengguna dapat menggantinya sendiri setelah masuk.</span></div>`
        :`<div class="field"><label>Reset kata sandi <span style="font-weight:500;color:var(--text-3)">(kosongkan jika tidak ingin mengubah)</span></label>${inputMata('f-pw','Kata sandi baru untuk '+esc(u.nama))}</div>`}
      <div id="f-err" style="color:var(--bad);font-size:12.5px;font-weight:600"></div>`,
    aksi:`<button class="btn" data-batal>Batal</button><button class="btn btn-primary" data-simpan>${baru?'Simpan Akun':'Perbarui'}</button>`
  });
  pasangToggleMata($('#modal-root'));
  $('#modal-root [data-batal]').onclick=tutup;
  $('#modal-root [data-simpan]').onclick=async ()=>{
    const nama=$('#f-nama').value.trim(), email=$('#f-email').value.trim(), pw=$('#f-pw').value;
    if(!nama||!email){ $('#f-err').textContent='Nama dan email wajib diisi.'; return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ $('#f-err').textContent='Format email belum benar.'; return; }
    if(DB.users.some(x=>x.email.toLowerCase()===email.toLowerCase() && x.id!==id)){ $('#f-err').textContent='Email sudah digunakan akun lain.'; return; }
    if(baru && pw.length<6){ $('#f-err').textContent='Kata sandi awal minimal 6 karakter.'; return; }
    if(!baru && pw && pw.length<6){ $('#f-err').textContent='Kata sandi baru minimal 6 karakter.'; return; }
    const isi={nama,email,nip:$('#f-nip').value.trim()||'-',role:$('#f-role').value,status:$('#f-status').value};
    const btnS=$('#modal-root [data-simpan]'), lbl=btnS.textContent;
    btnS.disabled=true; btnS.textContent='Menyimpan…';
    try{
      if(baru){
        const r = await panggilAkun('buat', Object.assign({password:pw}, isi));
        DB.users.push(Object.assign({id:r.id, gabung:today()}, isi)); catat('Tambah akun',nama);
      } else {
        const lokal = userById(id);
        if(adaSb(id)){
          if(id===S.user.id && (isi.role!==lokal.role || isi.status!=='aktif')) throw new Error('Kamu tidak bisa mengubah peran atau menonaktifkan akunmu sendiri.');
          await panggilAkun('ubah', Object.assign({id}, isi, pw?{password:pw}:{}));
        } else if(pw){ lokal.password = pw; }
        Object.assign(lokal, isi); catat('Ubah akun',nama+(pw?' (kata sandi direset)':''));
      }
    }catch(e){ $('#f-err').textContent = e.message; btnS.disabled=false; btnS.textContent=lbl; return; }
    simpan(); tutup(); render(); toast(baru?'Akun berhasil ditambahkan.':'Data akun diperbarui.','ok');
  };
}

function formAnggota(kid){
  const k=kelasById(kid);
  const kandidat = DB.users.filter(u=>u.role==='siswa' && !k.anggota.includes(u.id));
  const baris = su=>`<div class="row" data-baris="${su.id}" data-cari="${esc((su.nama+' '+su.nip+' '+su.email).toLowerCase())}" style="gap:8px;flex-wrap:nowrap">
      <label class="opt" style="flex:1;min-width:0"><input type="checkbox" value="${su.id}" class="pil-anggota">
        <span style="min-width:0"><b>${esc(su.nama)}</b><div style="font-size:12px;color:var(--text-3);overflow-wrap:anywhere">${esc(su.nip)} · ${esc(su.email)}</div></span></label>
      <button class="btn btn-sm" data-satu="${su.id}" style="flex-shrink:0">+ Tambah</button></div>`;
  const tutup = modal({judul:'Tambah Anggota ke '+k.nama, isi:
    kandidat.length? `<p style="color:var(--text-2);font-size:13.5px;margin-bottom:10px">Tambahkan <b>satu per satu</b> dengan tombol di tiap siswa, atau centang beberapa siswa lalu klik <b>Tambahkan Terpilih</b>. Untuk memasukkan semuanya sekaligus, gunakan <b>Tambah Semua</b>.</p>
      <input id="cariAnggota" type="text" placeholder="Cari nama, NIS, atau email…" style="margin-bottom:10px">
      <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <button class="btn btn-sm" id="pilSemua">Pilih Semua</button>
        <button class="btn btn-sm" id="pilKosong">Kosongkan Pilihan</button>
        <span id="infoPil" style="font-size:12.5px;color:var(--text-3);margin-left:auto"></span></div>
      <div id="daftarKand" style="display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto">${kandidat.map(baris).join('')}</div>
      <div id="kosongKand" class="empty" style="display:none">Semua siswa sudah terdaftar di kelas ini.</div>`
    : `<div class="empty">Semua siswa sudah terdaftar di kelas ini.</div>`,
    aksi: kandidat.length? `<button class="btn" data-batal>Tutup</button><button class="btn" id="tambahSemua">Tambah Semua</button><button class="btn btn-primary" data-ok>Tambahkan Terpilih</button>`
      : `<button class="btn" data-batal>Tutup</button>`});
  $('#modal-root [data-batal]').onclick=tutup;
  if(!kandidat.length) return;
  const root=$('#modal-root');
  const tampil = ()=>[...root.querySelectorAll('[data-baris]')].filter(r=>r.style.display!=='none');
  const segarkan = ()=>{
    const semua=[...root.querySelectorAll('[data-baris]')], vis=tampil();
    const pil=root.querySelectorAll('.pil-anggota:checked').length;
    $('#infoPil').textContent = pil+' dipilih · '+vis.length+' siswa tampil';
    $('#tambahSemua').textContent = 'Tambah Semua ('+vis.length+')';
    $('#tambahSemua').disabled = !vis.length;
    $('#kosongKand').style.display = semua.length? 'none':'block';
    $('#daftarKand').style.display = semua.length? 'flex':'none';
    if(!semua.length){ $('#pilSemua').disabled=true; $('#pilKosong').disabled=true; $('#tambahSemua').disabled=true; root.querySelector('[data-ok]').disabled=true; }
  };
  const tambah = ids=>{
    if(!ids.length){ toast('Belum ada siswa yang dipilih.','warn'); return; }
    ids.forEach(id=>{ if(!k.anggota.includes(id)) k.anggota.push(id); });
    catat('Tambah anggota', ids.length+' siswa ke '+k.nama);
    simpan();
    ids.forEach(id=>{ const r=root.querySelector('[data-baris="'+id+'"]'); if(r) r.remove(); });
    render(); segarkan();
    toast(ids.length+' siswa ditambahkan ke kelas.','ok');
  };
  $('#cariAnggota').oninput = e=>{
    const q=e.target.value.trim().toLowerCase();
    root.querySelectorAll('[data-baris]').forEach(r=> r.style.display = (!q || r.dataset.cari.includes(q))? '' : 'none');
    segarkan();
  };
  $('#pilSemua').onclick = ()=>{ tampil().forEach(r=> r.querySelector('.pil-anggota').checked=true); segarkan(); };
  $('#pilKosong').onclick = ()=>{ root.querySelectorAll('.pil-anggota').forEach(c=> c.checked=false); segarkan(); };
  root.addEventListener('change', e=>{ if(e.target.classList && e.target.classList.contains('pil-anggota')) segarkan(); });
  root.querySelectorAll('[data-satu]').forEach(b=> b.onclick=()=> tambah([b.dataset.satu]));
  $('#tambahSemua').onclick = ()=> tambah(tampil().map(r=>r.dataset.baris));
  root.querySelector('[data-ok]').onclick = ()=> tambah([...root.querySelectorAll('.pil-anggota:checked')].map(c=>c.value));
  segarkan();
}

function progresSiswa(sid){
  const kegiatan = [
    ...DB.lkpd.filter(l=>l.terbit).map(l=>({tipe:'lkpd',id:l.id})),
    ...DB.latihan.filter(t=>t.terbit).map(t=>({tipe:'latihan',id:t.id})),
    ...DB.evaluasi.filter(t=>t.terbit).map(t=>({tipe:'evaluasi',id:t.id}))
  ];
  const selesai = kegiatan.filter(g=>{ const k=getKiriman(sid,g.tipe,g.id); return k&&k.status!=='draf'; }).length;
  return {selesai, total:kegiatan.length, persen: kegiatan.length? Math.round(selesai/kegiatan.length*100):0};
}

/* ===== Penilaian LKPD (koreksi AI + validasi guru + umpan balik) =====
   Disimpan di kiriman.penilaian agar tidak bercampur dengan alur latihan/evaluasi:
   {status:'ai'|'draf'|'tervalidasi', ai:[{kode,skor,maks,yakin,catatan}], mesin, skorAI,
    skorGuru:{kode:n}, umpanTahap:{kode:teks}, catatanGuru, nilaiAkhir, validator, waktuValidasi} */
function bobotLkpd(L){
  const n=L.tahap.length||1, d=Math.floor(100/n), a=L.tahap.map(()=>d);
  a[n-1] += 100-d*n; return a;
}
function koreksiLokalLkpd(t, jw, adaFoto, maks){
  const teks=String(jw||'').trim();
  if(t.jtipe==='pg') return {skor:0, yakin:30, catatan:'Tahap pilihan ganda tanpa kunci jawaban. Guru menilai langsung.'};
  if(!teks){
    if(adaFoto) return {skor:0, yakin:30, catatan:'Jawaban berupa foto pekerjaan. AI tidak menilai gambar — guru menilai langsung dari foto.'};
    return {skor:0, yakin:100, catatan:'Tahap ini belum diisi.'};
  }
  const kata=teks.split(/\s+/).filter(Boolean).length;
  const r = kata<3 ? 0.15 : kata<8 ? 0.4 : kata<20 ? 0.65 : 0.85;
  return {skor:Math.round(maks*r), yakin:35,
    catatan:'Penilaian sementara berdasarkan kelengkapan jawaban ('+kata+' kata). Mesin lokal tidak dapat menilai ketepatan penalaran — guru perlu membaca isi jawaban.'};
}
async function koreksiAiLkpd(L, k){
  const maks=bobotLkpd(L), A=DB.aturan;
  const hasil=L.tahap.map((t,i)=> Object.assign({kode:t.kode, maks:maks[i]},
    koreksiLokalLkpd(t, k.jawaban[t.kode], !!(k.fotoTahap&&k.fotoTahap[t.kode]), maks[i])));
  if(AI_SIAP){
    try{
      const payload=L.tahap.map((t,i)=>({id:t.kode, tahap:t.nama, instruksi:t.instruksi, petunjuk:t.stimulus||'', skorMaks:maks[i],
        jawabanSiswa:k.jawaban[t.kode]||'', adaFoto:!!(k.fotoTahap&&k.fotoTahap[t.kode])}));
      const ketat={longgar:'Bersikap longgar: hargai usaha dan penalaran sebagian.', sedang:'Bersikap wajar dan proporsional.',
                   ketat:'Bersikap ketat: nilai tinggi hanya untuk penalaran yang benar-benar tepat dan lengkap.'}[A.aiKetelitian];
      const out=await AI.json(
        'Kamu adalah asisten guru matematika SMP kelas VIII (materi relasi dan fungsi). Nilai jawaban siswa pada LKPD berpendekatan konstruktivis berikut. '+
        'Tujuan LKPD: '+(L.tujuan||'-')+' Setiap tahap bernilai skorMaks. Nilai kualitas penalaran dan pemahaman konsep, bukan sekadar benar-salah: '+
        'pada tahap orientasi dan eksplorasi, jawaban yang beralasan tetap dihargai meski dugaannya belum tepat; pada tahap konstruksi, nilai ketepatan konsep; '+
        'pada presentasi dan diskusi, nilai kejelasan perbandingan dan kesepakatan; pada refleksi, nilai kejujuran dan kelengkapan. '+
        'Jawaban kosong, asal-asalan, atau hanya satu kata bernilai rendah. Bila siswa hanya mengirim foto, beri keyakinan rendah dan jangan beri nilai penuh. '+ketat+' '+
        'Rubrik tambahan dari guru: '+(A.aiRubrik||'-')+' '+
        'Balas HANYA JSON: {"hasil":[{"id":"<id tahap>","skor":angka,"yakin":0-100,"catatan":"umpan balik singkat berbahasa Indonesia untuk siswa: sebutkan yang sudah baik dan satu saran"}]}.\n\nDATA:\n'+
        JSON.stringify(payload), {modelTier:'default'});
      if(out && Array.isArray(out.hasil)){
        out.hasil.forEach(r=>{
          const h=hasil.find(x=>x.kode===r.id); if(!h) return;
          h.skor=Math.max(0,Math.min(h.maks, Number(r.skor)||0));
          h.yakin=Math.max(0,Math.min(100, Number(r.yakin)||60));
          h.catatan=String(r.catatan||h.catatan);
        });
        return {hasil, mesin:(AI&&AI.nama)||'AI'};
      }
    }catch(e){ _galatAI(e); }
  }
  return {hasil, mesin:'Mesin koreksi lokal'};
}
async function jalankanKoreksiLkpd(k, L){
  const {hasil, mesin}=await koreksiAiLkpd(L, k);
  const p = k.penilaian = k.penilaian || {status:'ai'};
  p.ai=hasil; p.mesin=mesin; p.skorAI=hasil.reduce((a,b)=>a+b.skor,0);
  p.skorGuru = p.skorGuru || {};
  hasil.forEach(h=>{ if(p.skorGuru[h.kode]===undefined) p.skorGuru[h.kode]=h.skor; });   // isian guru yang sudah ada tidak ditimpa
  if(p.status!=='tervalidasi') p.status='ai';
  catat('Koreksi AI LKPD', L.judul+' — '+(userById(k.siswa)||{nama:'siswa'}).nama);
}

    simpan(); render(); tutup(); toast('Nilai LKPD diterbitkan ke siswa.','ok');

}

async function prosesKoreksi(k, T){
  const {hasil, mesin} = await koreksiAI(T, k);
  k.ai = hasil; k.mesin = mesin;
  k.skorAI = hasil.reduce((a,b)=>a+b.skor,0);
  k.status='dikoreksi'; k.nilaiAkhir=null;
  catat('Koreksi AI', T.judul+' — '+userById(k.siswa).nama);
}
async function jalankanKoreksi(sid, tid, btn){
  const T=tesById(tid), k=getKiriman(sid,T.jenis,tid);
  btn.disabled=true; btn.textContent='Mengoreksi...';
  await prosesKoreksi(k,T); simpan(); render();
  toast('Koreksi AI selesai. Hasil menunggu validasi guru.','ok');
}

        <button class="btn btn-sm btn-danger" data-hp="${p.id}">Hapus</button></div></div>
      <div class="card-pad" style="color:var(--text-2)">${esc(p.isi)}</div></div>`).join('')

function formPeng(id){
  const p=id? DB.pengumuman.find(x=>x.id===id) : {judul:'',isi:'',kelas:DB.kelas[0]?.id,penting:false};
  const tutup=modal({judul:id?'Ubah Pengumuman':'Buat Pengumuman', isi:`
    <div class="field"><label>Judul</label><input id="p-judul" type="text" value="${esc(p.judul)}"></div>
    <div class="field"><label>Isi pengumuman</label><textarea id="p-isi" style="min-height:110px">${esc(p.isi)}</textarea></div>
    <div class="field"><label>Tujuan kelas</label><select id="p-kelas">${DB.kelas.map(k=>`<option value="${k.id}" ${p.kelas===k.id?'selected':''}>${esc(k.nama)}</option>`).join('')}</select></div>
    <label class="row" style="gap:9px;cursor:pointer"><span class="switch"><input type="checkbox" id="p-penting" ${p.penting?'checked':''}><span class="slider"></span></span>
      <span style="font-size:13.3px;font-weight:600">Tandai sebagai pengumuman penting</span></label>
    <div id="p-err" style="color:var(--bad);font-size:12.5px;font-weight:600;margin-top:8px"></div>`,
    aksi:`<button class="btn" data-batal>Batal</button><button class="btn btn-primary" data-ok>${id?'Perbarui':'Terbitkan'}</button>`});
  $('#modal-root [data-batal]').onclick=tutup;
  $('#modal-root [data-ok]').onclick=()=>{
    const judul=$('#p-judul').value.trim(), isi=$('#p-isi').value.trim();
    if(!judul||!isi){ $('#p-err').textContent='Judul dan isi wajib diisi.'; return; }
    const data={judul,isi,kelas:$('#p-kelas').value,penting:$('#p-penting').checked};
    if(id) Object.assign(p,data); else DB.pengumuman.unshift(Object.assign({id:uid('p'),tgl:today()},data));
    catat(id?'Ubah pengumuman':'Buat pengumuman',judul); simpan(); tutup(); render(); toast('Pengumuman diterbitkan.','ok');
  };
}

function vSiswaLkpd(){
  const list=DB.lkpd.filter(l=>l.terbit);
  if(!list.length) return '<div class="card card-pad"><div class="empty"><div class="ico">🧩</div>Belum ada LKPD yang dibuka.</div></div>';
  const sel=S.tmp.lk || list[0].id, L=list.find(x=>x.id===sel)||list[0];
  let k=getKiriman(S.user.id,'lkpd',L.id);
  if(!k){ k={siswa:S.user.id,tipe:'lkpd',ref:L.id,key:kKey(S.user.id,'lkpd',L.id),jawaban:{},status:'draf',waktu:null}; DB.kiriman[k.key]=k; }
  const ti = Math.min(S.tmp.ti??0, L.tahap.length-1), t=L.tahap[ti];
  const terkumpul = k.status!=='draf';
  const terisi = kk => (k.jawaban[kk]||'').trim().length>0 || !!(k.fotoTahap && k.fotoTahap[kk]);
  const jadwal = terkumpul? {ok:true} : cekJadwal(L);

  pasangView=()=>{
    document.querySelectorAll('[data-lk]').forEach(b=> b.onclick=()=>{ S.tmp.lk=b.dataset.lk; S.tmp.ti=0; render(); });
    document.querySelectorAll('[data-ti]').forEach(b=> b.onclick=()=>{ simpanJawaban(); S.tmp.ti=+b.dataset.ti; render(); });
    const ta=$('#jw'); if(ta) ta.oninput=()=>{ k.jawaban[t.kode]=ta.value; };
    document.querySelectorAll('.jw-lkpd-pg').forEach(r=> r.onchange=()=>{ k.jawaban[t.kode]=r.value; simpan(); });
    const kl=$('#kamLkpd'); if(kl) kl.onclick=()=>{ simpanJawaban(); bukaKamera(d=>{ k.fotoTahap[t.kode]=d; simpan(); render(); toast('Foto pekerjaan tersimpan.','ok'); }); };
    const hf=$('#hapusFotoLkpd'); if(hf) hf.onclick=()=>{ simpanJawaban(); delete k.fotoTahap[t.kode]; simpan(); render(); };
    const pv=$('#tPrev'); if(pv) pv.onclick=()=>{ simpanJawaban(); S.tmp.ti=ti-1; render(); window.scrollTo(0,0); };
    const nx=$('#tNext'); if(nx) nx.onclick=()=>{ simpanJawaban(); S.tmp.ti=ti+1; render(); window.scrollTo(0,0); };
    const sv=$('#tSave'); if(sv) sv.onclick=()=>{ simpanJawaban(); toast('Pekerjaanmu tersimpan sebagai draf.','ok'); render(); };
    const km=$('#tKirim'); if(km) km.onclick=()=>{
      simpanJawaban();
      const kosong=L.tahap.filter(x=>!terisi(x.kode));
      if(kosong.length){ toast('Masih ada '+kosong.length+' tahap yang belum diisi: '+kosong.map(x=>x.nama).join(', '),'warn'); return; }
      konfirmasi('Kumpulkan LKPD ini? Setelah dikumpulkan kamu masih bisa membaca jawabanmu, tetapi tidak dapat mengubahnya.',()=>{
        k.status='terkirim'; k.waktu=new Date().toISOString();
        catat('Kumpulkan LKPD', L.judul); simpan(); render(); toast('LKPD berhasil dikumpulkan. 🎉','ok');
      },'Kumpulkan');
    };
  };
  function simpanJawaban(){ const ta=$('#jw'); if(ta&&!terkumpul){ k.jawaban[t.kode]=ta.value; k.waktu=new Date().toISOString(); simpan(); } }

  return `
  <div class="grid g-side">
    <div class="stack">
      <div class="card"><div class="card-pad">
        <div class="row" style="gap:9px;margin-bottom:8px">
          <span class="badge b-brand">LKPD</span>
          <span class="badge ${terkumpul?'b-ok':'b-warn'}">${terkumpul?'Sudah dikumpulkan':'Sedang dikerjakan'}</span>
          ${(L.jamMulai&&L.jamMulai!=='00:00')||(L.jamSelesai&&L.jamSelesai!=='23:59')?`<span class="badge b-info">Jam ${esc(L.jamMulai||'00:00')}–${esc(L.jamSelesai||'23:59')}</span>`:''}
          <span style="font-size:12.5px;color:var(--text-3);margin-left:auto">Tenggat ${fmtTgl(L.tenggat)}</span></div>
        <h2 style="font-size:20px;margin-bottom:8px">${esc(L.judul)}</h2>
        <div style="background:var(--brand-soft);border-radius:11px;padding:12px 14px;margin-bottom:13px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)">Tujuan</div>
          <div style="font-size:13.6px;margin-top:3px">${esc(L.tujuan)}</div></div>
        <div style="border:1px solid var(--border);border-radius:11px;padding:13px 15px;background:var(--surface-2)">
          <b style="font-size:13.3px">📋 Petunjuk Pengerjaan</b>
          <ol style="margin:7px 0 0;padding-left:20px;font-size:13.4px;color:var(--text-2)">
            ${L.petunjuk.map(p=>`<li style="margin-bottom:4px">${esc(p)}</li>`).join('')}</ol></div>
      </div></div>
      ${kartuNilaiLkpd(k,L)}

      <div class="card"><div class="card-pad">
        ${!jadwal.ok? `<div class="empty" style="padding:30px">
            <div class="ico">${jadwal.alasan==='tenggat'?'⏰':'🕐'}</div>
            <b style="font-size:15.5px;color:var(--text)">Belum bisa dikerjakan sekarang</b>

        <div style="border-left:3px solid var(--brand);padding:2px 0 2px 13px;margin-bottom:12px">
          <div style="font-size:14.2px;line-height:1.7">${esc(t.instruksi)}</div>
          ${t.stimulus?`<div style="font-size:13px;color:var(--text-3);margin-top:7px">💡 ${esc(t.stimulus)}</div>`:''}

          ${f?`<img src="${f}" alt="Foto pekerjaan tahap ${esc(t.nama)}" style="border-radius:10px;border:1px solid var(--border);max-height:240px;margin-bottom:6px">`:''}`;})()}

        <div class="pager" style="margin-top:14px">
          ${ti>0? '<button class="btn" id="tPrev">← Tahap Sebelumnya</button>':'<span style="flex:1"></span>'}
          ${ti<L.tahap.length-1? '<button class="btn btn-primary" id="tNext">Tahap Berikutnya →</button>'
            : (terkumpul? '<span style="flex:1"></span>' : '<button class="btn btn-ok" id="tKirim">✓ Kumpulkan LKPD</button>')}
        </div>
        ${!terkumpul?'<button class="btn btn-block btn-sm" id="tSave" style="margin-top:9px">💾 Simpan sebagai draf</button>':''}`}
      </div></div>
    </div>

    <div class="stack">
      <div class="card"><div class="card-head"><h3>Progres LKPD Ini</h3></div>
        <div class="card-pad">
          <div class="bar ${L.tahap.every(x=>terisi(x.kode))?'ok':''}" style="margin-bottom:10px">
            <span style="width:${L.tahap.filter(x=>terisi(x.kode)).length/L.tahap.length*100}%"></span></div>
          <div style="font-size:13px;color:var(--text-2)">${L.tahap.filter(x=>terisi(x.kode)).length} dari ${L.tahap.length} tahap terisi</div>
        </div></div>
      <div class="card"><div class="card-head"><h3>Daftar LKPD</h3></div>
        <div class="card-pad" style="display:flex;flex-direction:column;gap:7px">
          ${list.map(x=>{ const kk=getKiriman(S.user.id,'lkpd',x.id);
            return `<button class="toc-item ${x.id===L.id?'active':''}" data-lk="${x.id}" style="padding:11px">
              <b>${esc(x.judul)}</b><div class="row" style="gap:6px;margin-top:4px">
                <span class="badge ${kk&&kk.status!=='draf'?'b-ok':kk?'b-warn':'b-mute'}">${kk&&kk.status!=='draf'?'Terkumpul':kk?'Draf':'Belum dibuka'}</span></div></button>`;}).join('')}
        </div></div>
    </div>
  </div>`;
}

function vSiswaTes(){
  const jenis = S.view==='evaluasi'?'evaluasi':'latihan';
  const list = (jenis==='evaluasi'?DB.evaluasi:DB.latihan).filter(t=>t.terbit);
  if(!list.length) return `<div class="card card-pad"><div class="empty"><div class="ico">📝</div>Belum ada ${jenis} yang dibuka guru.</div></div>`;
  const sel=S.tmp.ts||list[0].id, T=list.find(x=>x.id===sel)||list[0];
  let k=getKiriman(S.user.id,jenis,T.id);
  const sudah = k && k.status!=='draf';
  const syarat = cekSyarat(T, S.user.id);
  const jadwal = syarat.ok? cekJadwal(T) : {ok:true};
  const modeAwas = DB.aturan.pengawasan && T.awas!==false && !sudah && syarat.ok && jadwal.ok;
  S.tmp.foto = S.tmp.foto || {};

  function kirimJawaban(paksa, riwayat){
    Waktu.hentikan();
    const jawaban = Object.assign({}, S.tmp.draft||{});
    const key=kKey(S.user.id,jenis,T.id);
    DB.kiriman[key]={siswa:S.user.id,tipe:jenis,ref:T.id,key,jawaban,foto:Object.assign({},S.tmp.foto),
      status:'terkirim',waktu:new Date().toISOString(),skorAI:null,nilaiAkhir:null,
      pelanggaran: riwayat||Awas.riwayat.slice(), dipaksa:!!paksa};
    catat(paksa?'Pengiriman paksa (indikasi kecurangan)':'Kumpulkan '+jenis, T.judul);
    S.tmp.draft={}; S.tmp.foto={}; Awas.hentikan();
    const K=DB.kiriman[key];
    simpan(); render();
    if(DB.aturan.aiOtomatis){
      toast('Jawaban terkirim. AI sedang mengoreksi...','ok');
      prosesKoreksi(K, T).then(()=>{ simpan(); if(S.view===jenis) render(); });
    } else toast('Jawabanmu terkirim dan menunggu koreksi guru.','ok');
  }

  pasangView=()=>{
    document.querySelectorAll('[data-ts]').forEach(b=> b.onclick=()=>{ Awas.hentikan(); Waktu.hentikan(); S.tmp.ts=b.dataset.ts; S.tmp.draft={}; S.tmp.foto={}; render(); });
    document.querySelectorAll('.jw-soal').forEach(inp=> inp.oninput=()=>{ S.tmp.draft=S.tmp.draft||{}; S.tmp.draft[inp.dataset.s]=inp.value; });
    document.querySelectorAll('.jw-pg').forEach(inp=> inp.onchange=()=>{ S.tmp.draft=S.tmp.draft||{}; S.tmp.draft[inp.name.replace('pg-','')]=inp.value; });
    document.querySelectorAll('[data-kam]').forEach(b=> b.onclick=()=> bukaKamera(d=>{ S.tmp.foto[b.dataset.kam]=d; render(); toast('Foto jawaban tersimpan.','ok'); }));
    document.querySelectorAll('[data-hfoto]').forEach(b=> b.onclick=()=>{ delete S.tmp.foto[b.dataset.hfoto]; render(); });
    const kirim=$('#kirimTes');
    if(kirim) kirim.onclick=()=>{
      const jawaban = Object.assign({}, S.tmp.draft||{});
      const kosong = T.soal.filter(s=>!(jawaban[s.id]||'').trim() && !S.tmp.foto[s.id]);
      if(kosong.length) konfirmasi(kosong.length+' soal belum terjawab. Tetap kumpulkan?', ()=>kirimJawaban(false), 'Tetap Kumpulkan');
      else konfirmasi('Kumpulkan jawabanmu sekarang? Jawaban tidak dapat diubah setelah dikumpulkan.', ()=>kirimJawaban(false), 'Kumpulkan');
    };
    if(modeAwas){
      if(Awas.aktif && Awas.ctx && Awas.ctx.ref===T.id) Awas.ctx.onPaksa = r=>kirimJawaban(true,r);
      else Awas.mulai({ref:T.id, onPaksa:r=>kirimJawaban(true,r)});
    } else Awas.hentikan();
    if(T.durasi>0 && !sudah && syarat.ok && jadwal.ok){
      if(!Waktu.jalan) Waktu.mulai(T.durasi*60, ()=>{ toast('Waktu habis. Jawabanmu dikirim otomatis.','bad'); kirimJawaban(false); });
      else Waktu.onHabis=()=>{ toast('Waktu habis. Jawabanmu dikirim otomatis.','bad'); kirimJawaban(false); };
    } else Waktu.hentikan();
  };

  if(!syarat.ok) return `
    <div class="grid g-side">
      <div class="card card-pad"><div class="empty" style="padding:40px">
        <div class="ico">🔒</div>
        <b style="font-size:16px;color:var(--text)">${esc(T.judul)} belum dapat dikerjakan</b>
        <p style="margin-top:8px;max-width:420px;margin-inline:auto">Guru mengatur pengerjaan secara bertahap. Selesaikan dan kumpulkan
          <b style="color:var(--brand)">${esc(syarat.nama)}</b> terlebih dahulu, lalu halaman ini akan terbuka otomatis.</p>
        <button class="btn btn-primary btn-sm" data-go="lkpd" style="margin-top:14px">Buka kegiatan prasyarat →</button>
      </div></div>
      ${daftarTes(list,T,jenis)}
    </div>`;

  if(!sudah && !jadwal.ok) return `
    <div class="grid g-side">
      <div class="card card-pad"><div class="empty" style="padding:40px">
        <div class="ico">${jadwal.alasan==='tenggat'?'⏰':'🕐'}</div>
        <b style="font-size:16px;color:var(--text)">${esc(T.judul)} belum bisa dikerjakan sekarang</b>
        <p style="margin-top:8px;max-width:420px;margin-inline:auto">${esc(jadwal.pesan)}</p>
        ${(T.jamMulai&&T.jamMulai!=='00:00')||(T.jamSelesai&&T.jamSelesai!=='23:59')
          ? `<span class="badge b-info" style="margin-top:10px">Jam pengerjaan: ${esc(T.jamMulai||'00:00')}–${esc(T.jamSelesai||'23:59')}</span>`:''}
      </div></div>
      ${daftarTes(list,T,jenis)}
    </div>`;

  const isiSoal = sudah? '' : T.soal.map((s,i)=>{
    const val=(S.tmp.draft||{})[s.id]||'', foto=S.tmp.foto[s.id];
    return `<div class="q">
      <div class="row" style="justify-content:space-between"><span class="q-num">Soal ${i+1}</span><span class="badge b-mute">${s.skor} poin</span></div>
      <div style="font-weight:600;margin:6px 0 10px;font-size:14.5px">${esc(s.teks)}</div>
      ${s.tipe==='pg'
        ? s.opsi.map((o,j)=>`<label class="opt"><input type="radio" class="jw-pg" name="pg-${s.id}" value="${esc(o)}" ${val===o?'checked':''}>
            <span><b class="mono">${String.fromCharCode(65+j)}.</b> ${esc(o)}</span></label>`).join('')
        : s.tipe==='uraian'
          ? `<textarea class="jw-soal" data-s="${s.id}" style="min-height:130px" placeholder="Tuliskan langkah penyelesaianmu secara lengkap...">${esc(val)}</textarea>`
          : s.tipe==='foto'
            ? `<div class="callout tip" style="margin:0">Soal ini dijawab dengan <b>memotret pekerjaanmu</b>. Tekan tombol kamera di bawah.</div>`
            : `<input class="jw-soal" data-s="${s.id}" type="text" value="${esc(val)}" placeholder="Tulis jawabanmu, contoh: 5a+8b">`}
      ${s.tipe!=='pg'? `<div class="row" style="margin-top:9px;gap:8px">
          <button class="btn btn-sm" data-kam="${s.id}">📷 ${foto?'Ambil Ulang Foto':'Foto Jawaban Tulisan Tangan'}</button>
          ${foto?`<button class="btn btn-sm btn-danger" data-hfoto="${s.id}">Hapus Foto</button>`:''}
        </div>
        ${foto?`<img src="${foto}" alt="Foto jawaban soal ${i+1}" style="margin-top:9px;border-radius:10px;border:1px solid var(--border);max-height:230px">`:''}`:''}
      ${s.petunjuk?`<div style="font-size:12.3px;color:var(--text-3);margin-top:7px">💡 ${esc(s.petunjuk)}</div>`:''}
    </div>`;
  }).join('');

  return `
  ${T.durasi>0 && !sudah && syarat.ok? `<div class="card" style="margin-bottom:14px;border-color:var(--warn)">
    <div class="card-pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span style="font-size:20px">⏱️</span>
      <div style="flex:1;min-width:200px"><b>Waktu pengerjaan dibatasi ${T.durasi} menit.</b>
        <div style="font-size:13px;color:var(--text-2)">Saat waktu habis, jawaban yang sudah kamu isi dikirim otomatis. Hitungan berjalan sejak halaman ini dibuka.</div></div>
      <span class="badge b-ok" style="font-size:16px;padding:6px 14px">Sisa <b id="jamUjian" class="mono">${String(T.durasi).padStart(2,'0')}:00</b></span>
    </div></div>`:''}
  ${modeAwas? `<div class="card" style="margin-bottom:14px;border-color:var(--brand)"><div class="card-pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span style="font-size:20px">🔒</span>
      <div style="flex:1;min-width:230px"><b>Mode fokus aktif.</b>
        <div style="font-size:13px;color:var(--text-2)">Tetaplah di halaman ini selama mengerjakan. Berpindah tab, membuka aplikasi atau situs lain akan tercatat. Setelah <b>${DB.aturan.maksPelanggaran}</b> pelanggaran, jawabanmu dikirim otomatis dan gurumu menerima laporan.</div></div>
      <span class="badge b-ok" id="awasBar">🔒 Mode fokus aktif</span>
      <span class="badge b-mute">Pelanggaran: <b id="awasHit">0</b></span>
    </div></div>`:''}
  <div class="grid g-side">
    <div class="card">
      <div class="card-head"><h3>${esc(T.judul)}</h3>
        <span class="badge ${jenis==='evaluasi'?'b-info':'b-mute'}" style="text-transform:capitalize">${jenis}</span>
        <div class="right"><span class="sub">Tenggat ${fmtTgl(T.tenggat)} · ${T.soal.length} soal</span></div></div>
      <div class="card-pad">
        ${sudah? `<div class="empty" style="padding:34px">
            <div class="ico">${k.status==='tervalidasi'?'🏅':'⏳'}</div>
            <b style="font-size:16px;color:var(--text)">${k.status==='tervalidasi'?'Sudah dinilai':'Jawaban sudah terkumpul'}</b>
            <p style="margin-top:6px">${k.status==='tervalidasi'
              ? 'Nilai akhirmu <b style="color:var(--ok)">'+k.nilaiAkhir+'</b>. Lihat umpan balik lengkap di menu Hasil Belajar Saya.'
              : (k.status==='dikoreksi'? 'Sudah dikoreksi AI dan sedang menunggu validasi gurumu.' : 'Pekerjaanmu sedang dikoreksi dan menunggu validasi guru.')}</p>
            ${k.dipaksa?'<div class="callout warn" style="max-width:430px;margin:12px auto 0">Jawaban ini terkirim otomatis karena mode fokus mendeteksi kamu meninggalkan halaman. Gurumu akan meninjaunya.</div>':''}
            <div style="font-size:12.3px;margin-top:8px">Dikumpulkan ${new Date(k.waktu).toLocaleString('id-ID')}</div></div>`
          : `<div class="callout tip" style="margin-top:0">Kerjakan seluruh soal, lalu tekan <b>Kumpulkan</b>. Kamu boleh mengetik jawaban atau memotret pekerjaan tulis tanganmu. Jawaban dikoreksi AI dan nilai akhirnya divalidasi gurumu.</div>
             ${isiSoal}
             <button class="btn btn-primary btn-block" id="kirimTes" style="padding:12px;margin-top:6px">✓ Kumpulkan Jawaban</button>`}
      </div>
    </div>
    ${daftarTes(list,T,jenis)}
  </div>`;
}
function daftarTes(list,T,jenis){
  return `<div class="card"><div class="card-head"><h3 style="text-transform:capitalize">Daftar ${jenis}</h3></div>
    <div class="card-pad" style="display:flex;flex-direction:column;gap:7px">
      ${list.map(x=>{ const kk=getKiriman(S.user.id,jenis,x.id), sy=cekSyarat(x,S.user.id);
        const jd = sy.ok? cekJadwal(x) : {ok:true};
        const terkunci = !sy.ok || !jd.ok;
        return `<button class="toc-item ${x.id===T.id?'active':''}" data-ts="${x.id}" style="padding:11px">
          <div class="row" style="gap:6px">${terkunci?'<span>🔒</span>':''}<b>${esc(x.judul)}</b></div>
          <div class="row" style="gap:6px;margin-top:4px">
            <span class="badge ${terkunci?'b-mute':kk?(kk.status==='tervalidasi'?'b-ok':'b-warn'):'b-mute'}">${
              !sy.ok? 'Terkunci (prasyarat)' : !jd.ok? (jd.alasan==='tenggat'?'Tenggat lewat':'Di luar jam') : kk?(kk.status==='tervalidasi'?'Nilai '+kk.nilaiAkhir:'Menunggu nilai'):'Belum dikerjakan'}</span>
            <span style="font-size:11.5px;color:var(--text-3)">${x.soal.length} soal</span></div></button>`;}).join('')}
    </div></div>`;
}

function vSiswaNilai(){
  const hasil = Object.values(DB.kiriman).filter(x=>x.siswa===S.user.id && (x.tipe==='latihan'||x.tipe==='evaluasi'));
  const dinilai = hasil.filter(x=>x.status==='tervalidasi');
  const rata = dinilai.length? Math.round(dinilai.reduce((a,b)=>a+b.nilaiAkhir,0)/dinilai.length):null;
  const r = rekapSiswa(S.user.id);
  pasangView=()=>{
    $('#unduhRaporSaya').onclick=()=> unduh('Rapor-'+S.user.nama.replace(/\s+/g,'-')+'.html', raporHTML(S.user.id), 'text/html;charset=utf-8');
    $('#unduhCsvSaya').onclick=()=>{
      const baris=[['Kegiatan','Jenis','Nilai','Catatan Guru']].concat(r.nilai.map(n=>{const T=tesById(n.ref);
        return [T?T.judul:'-', n.tipe, n.nilaiAkhir, n.catatanGuru||''];}));
      unduh('Nilai-'+S.user.nama.replace(/\s+/g,'-')+'.csv','\uFEFF'+baris.map(b=>b.map(csvAman).join(';')).join('\n'),'text/csv;charset=utf-8'); };
  };
  return `
  <div class="grid g4" style="margin-bottom:18px">
    ${statCard('Rata-rata Nilai', rata??'—', 'dari '+dinilai.length+' penilaian')}
    ${statCard('Sudah Dinilai', dinilai.length+'/'+hasil.length, 'telah divalidasi guru')}
    ${statCard('Nilai Tertinggi', dinilai.length? Math.max(...dinilai.map(x=>x.nilaiAkhir)) : '—', 'pencapaian terbaikmu')}
    ${statCard('Kehadiran', r.hadir+'%', 'seluruh pertemuan')}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span style="font-size:20px">⬇️</span>
    <div style="flex:1;min-width:210px"><b>Unduh laporan hasil belajarmu</b>
      <div style="font-size:13px;color:var(--text-2)">Berisi identitas, rincian nilai, kehadiran, dan umpan balik guru — siap dicetak atau dikirim ke orang tua.</div></div>
    <button class="btn btn-primary btn-sm" id="unduhRaporSaya">Unduh Rapor (HTML)</button>
    <button class="btn btn-sm" id="unduhCsvSaya">Unduh Nilai (CSV)</button>
  </div></div>
  ${r.umpan.length? `<div class="card" style="margin-bottom:16px">
    <div class="card-head"><h3>✉️ Umpan Balik dari Guru</h3><span class="sub">khusus untukmu</span></div>
    <div class="card-pad" style="display:flex;flex-direction:column;gap:10px">
      ${r.umpan.map(u=>`<div style="border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:11px;padding:12px 14px;background:var(--surface-2)">
        <div style="font-size:11.8px;color:var(--text-3)">${esc(u.guru)} · ${fmtTgl(u.tgl)}</div>
        <div style="font-size:14px;margin-top:4px">${esc(u.isi)}</div></div>`).join('')}
    </div></div>`:''}
  <div class="stack">
    ${hasil.length? hasil.map(k=>{
      const T=tesById(k.ref);
      if(k.status!=='tervalidasi') return `<div class="card"><div class="card-pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span style="font-size:20px">⏳</span><div style="flex:1;min-width:200px"><b>${esc(T.judul)}</b>
        <div style="font-size:13px;color:var(--text-2)">Sedang menunggu koreksi dan validasi guru.</div></div>
        <span class="badge b-warn">Belum terbit</span></div></div>`;
      return `<div class="card">
        <div class="card-head"><h3>${esc(T.judul)}</h3>
          <span class="badge ${T.jenis==='evaluasi'?'b-info':'b-mute'}" style="text-transform:capitalize">${esc(T.jenis)}</span>
          <div class="right"><span class="badge ${k.nilaiAkhir>=75?'b-ok':'b-warn'}" style="font-size:14px;padding:5px 13px">Nilai ${k.nilaiAkhir}</span></div></div>
        <div class="card-pad">
          ${k.catatanGuru?`<div class="callout tip" style="margin-top:0"><b>Catatan gurumu:</b> ${esc(k.catatanGuru)}</div>`:''}
          <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">Divalidasi oleh ${esc(k.validator||'guru')} · ${k.waktuValidasi?fmtTgl(k.waktuValidasi):''}</div>
          ${T.soal.map((s,i)=>{
            const a=k.ai? k.ai.find(x=>x.soalId===s.id):null;
            const sg=k.skorGuru? k.skorGuru[s.id] : (a?a.skor:0);
            return `<div class="q" style="margin-bottom:9px">
              <div class="row" style="justify-content:space-between"><span class="q-num">Soal ${i+1}</span>
                <span class="badge ${sg>=s.skor?'b-ok':sg>0?'b-warn':'b-bad'}">${sg}/${s.skor}</span></div>
              <div style="font-weight:600;margin:5px 0 7px">${esc(s.teks)}</div>
              <div style="font-size:12.5px;color:var(--text-3)">Jawabanmu</div>
              <div style="border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--surface-2);font-size:13.4px;white-space:pre-wrap">${esc(k.jawaban[s.id]||'(kosong)')}</div>
              ${k.foto&&k.foto[s.id]?`<img src="${k.foto[s.id]}" alt="Foto jawabanmu" style="margin-top:7px;border-radius:9px;border:1px solid var(--border);max-height:200px">`:''}
              ${a?`<div style="font-size:13.2px;color:var(--text-2);margin-top:7px">💬 ${esc(a.catatan)}</div>`:''}
            </div>`;
          }).join('')}
        </div></div>`;
    }).join('') : '<div class="card card-pad"><div class="empty"><div class="ico">🏅</div>Belum ada nilai. Kerjakan latihan atau evaluasi terlebih dahulu.</div></div>'}
  </div>`;
}
