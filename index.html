/* --- kamera langsung (bukan pemilih berkas) --- */
async function bukaKamera(onAmbil){
  let stream=null;
  const tutup = modal({judul:'Ambil Foto Jawaban', lebar:true, isi:`
    <div id="kam-wrap" style="position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:220px;display:grid;place-items:center">
      <video id="kam-vid" autoplay playsinline muted style="width:100%;display:block;max-height:58vh;object-fit:contain"></video>
      <div id="kam-info" style="position:absolute;color:#fff;font-size:13px;opacity:.8">Menyalakan kamera…</div>
    </div>
    <canvas id="kam-can" style="display:none"></canvas>
    <div id="kam-galat" style="display:none;margin-top:12px">
      <div class="callout warn" style="margin:0"><b>Kamera tidak dapat dibuka.</b> Perangkat menolak akses atau tidak memiliki kamera. Gunakan tombol cadangan di bawah — pada ponsel tombol ini tetap membuka aplikasi kamera secara langsung.</div>
      <input type="file" id="kam-file" accept="image/*" capture="environment" style="margin-top:10px">
    </div>
    <p style="font-size:12.5px;color:var(--text-3);margin:10px 0 0">Pastikan seluruh tulisan terbaca dan tidak terpotong sebelum menekan Ambil Foto.</p>`,
    aksi:`<button class="btn" data-batal>Batal</button>
          <button class="btn" data-ganti>🔄 Ganti Kamera</button>
          <button class="btn btn-primary" data-jepret>📷 Ambil Foto</button>`});
  let hadap='environment';
  const vid=$('#kam-vid');
  async function nyalakan(){
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:hadap, width:{ideal:1280}}, audio:false});
      vid.srcObject=stream; $('#kam-info').style.display='none';
    }catch(e){
      $('#kam-wrap').style.display='none'; $('#kam-galat').style.display='block';
      const f=$('#kam-file');
      if(f) f.onchange=()=>{ const file=f.files[0]; if(!file) return;
        const r=new FileReader(); r.onload=()=>{ kecilkan(r.result, d=>{ bersih(); tutup(); onAmbil(d); }); }; r.readAsDataURL(file); };
    }
  }
  function bersih(){ if(stream) stream.getTracks().forEach(t=>t.stop()); }
  function kecilkan(src, cb){
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'), maks=1000;
      const sk=Math.min(1, maks/Math.max(img.width,img.height));
      c.width=img.width*sk; c.height=img.height*sk;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.62));
    };
    img.src=src;
  }
  $('#modal-root [data-batal]').onclick=()=>{ bersih(); tutup(); };
  $('#modal-root [data-ganti]').onclick=()=>{ hadap = hadap==='environment'?'user':'environment'; nyalakan(); };
  $('#modal-root [data-jepret]').onclick=()=>{
    if(!stream){ toast('Kamera belum aktif.','warn'); return; }
    const c=$('#kam-can'); c.width=vid.videoWidth; c.height=vid.videoHeight;
    c.getContext('2d').drawImage(vid,0,0);
    kecilkan(c.toDataURL('image/jpeg',0.9), d=>{ bersih(); tutup(); onAmbil(d); });
  };
  nyalakan();
}

/* --- pengawasan fokus pengerjaan --- */
const Awas = {
  aktif:false, ctx:null, jml:0, riwayat:[], _t:null,
  mulai(ctx){
    if(!DB.aturan.pengawasan) return;
    this.hentikan(); this.aktif=true; this.ctx=ctx; this.jml=0; this.riwayat=[];
    this._vis=()=>{ if(document.hidden) this.langgar('Berpindah ke tab atau aplikasi lain'); };
    this._blur=()=>{ this._t=setTimeout(()=>{ if(!document.hasFocus()) this.langgar('Jendela e-learning kehilangan fokus'); },350); };
    this._focus=()=>{ clearTimeout(this._t); };
    this._salin=e=>{ if(DB.aturan.blokirSalin){ e.preventDefault(); this.langgar('Mencoba menyalin atau menempel teks'); } };
    this._keluarFS=()=>{ if(DB.aturan.layarPenuh && !document.fullscreenElement) this.langgar('Keluar dari mode layar penuh'); };
    document.addEventListener('visibilitychange', this._vis);
    window.addEventListener('blur', this._blur);
    window.addEventListener('focus', this._focus);
    document.addEventListener('copy', this._salin);
    document.addEventListener('paste', this._salin);
    document.addEventListener('contextmenu', this._salin);
    document.addEventListener('fullscreenchange', this._keluarFS);
    if(DB.aturan.layarPenuh){ try{ document.documentElement.requestFullscreen(); }catch(e){} }
  },
  langgar(jenis){
    if(!this.aktif) return;
    this.jml++; this.riwayat.push({jenis, waktu:new Date().toISOString()});
    const sisa = DB.aturan.maksPelanggaran - this.jml;
    const el=$('#awasHit'); if(el) el.textContent=this.jml;
    const bar=$('#awasBar'); if(bar){ bar.className='badge '+(this.jml?'b-bad':'b-ok');
      bar.innerHTML = this.jml? '⚠ Terdeteksi '+this.jml+' pelanggaran' : '🔒 Mode fokus aktif'; }
    if(DB.aturan.autoKirim && sisa<=0){
      toast('Batas pelanggaran terlampaui. Jawabanmu dikirim otomatis.','bad');
      const f=this.ctx&&this.ctx.onPaksa; this.hentikan(); if(f) f(this.riwayat);
    } else {
      toast('Peringatan: '+jenis+'. Sisa toleransi '+Math.max(0,sisa)+'x sebelum jawaban dikirim otomatis.','bad');
    }
  },
  hentikan(){
    if(this._vis) document.removeEventListener('visibilitychange', this._vis);
    if(this._blur) window.removeEventListener('blur', this._blur);
    if(this._focus) window.removeEventListener('focus', this._focus);
    if(this._salin){ document.removeEventListener('copy', this._salin); document.removeEventListener('paste', this._salin); document.removeEventListener('contextmenu', this._salin); }
    if(this._keluarFS) document.removeEventListener('fullscreenchange', this._keluarFS);
    clearTimeout(this._t); this.aktif=false;
    if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(e){} }
  }
};
const Waktu = {
  jalan:false, sisa:0, _t:null,
  mulai(detik, onHabis){
    this.hentikan(); this.jalan=true; this.sisa=detik; this.onHabis=onHabis;
    this._t=setInterval(()=>{
      this.sisa--;
      const el=document.getElementById('jamUjian');
      if(el){
        const m=Math.floor(Math.max(0,this.sisa)/60), d=Math.max(0,this.sisa)%60;
        el.textContent=String(m).padStart(2,'0')+':'+String(d).padStart(2,'0');
        el.parentElement.className='badge '+(this.sisa<=60?'b-bad':this.sisa<=300?'b-warn':'b-ok');
      }
      if(this.sisa===300) toast('Sisa waktu 5 menit.','warn');
      if(this.sisa<=0){ const f=this.onHabis; this.hentikan(); if(f) f(); }
    },1000);
  },
  hentikan(){ clearInterval(this._t); this.jalan=false; }
};

/* --- prasyarat bertahap --- */
function namaKegiatan(tipe,id){
  if(tipe==='lkpd') return DB.lkpd.find(x=>x.id===id)?.judul || 'LKPD';
  return tesById(id)?.judul || 'kegiatan sebelumnya';
}
function cekSyarat(item, sid){
  if(!DB.aturan.prasyarat || !item.syarat) return {ok:true};
  const k = getKiriman(sid, item.syarat.tipe, item.syarat.id);
  return {ok: !!(k && k.status!=='draf'), nama: namaKegiatan(item.syarat.tipe, item.syarat.id)};
}
function cekJadwal(item){
  if(item.tenggat && today() > item.tenggat){
    return {ok:false, alasan:'tenggat', pesan:'Tenggat pengerjaan ('+fmtTgl(item.tenggat)+') sudah terlewat. Hubungi gurumu bila masih perlu mengerjakan.'};
  }
  const jm=item.jamMulai||'00:00', js=item.jamSelesai||'23:59';
  if(jm!=='00:00' || js!=='23:59'){
    const jam = new Date().toTimeString().slice(0,5);
    if(jam<jm) return {ok:false, alasan:'jam', pesan:'Baru dapat dikerjakan mulai pukul '+jm+'. Coba lagi nanti.'};
    if(jam>js) return {ok:false, alasan:'jam', pesan:'Waktu pengerjaan hari ini sudah lewat pukul '+js+'. Coba lagi besok pada jam yang ditentukan.'};
  }
  return {ok:true};
}

function _lokalSekarang(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function statusAbsen(a){
  const n=_lokalSekarang();
  if(!a.bukaTgl) return a.tanggal===n.slice(0,10) ? 'buka' : (a.tanggal>n.slice(0,10)?'belum':'tutup');  // pertemuan lama: hanya hari yang sama
  const b=a.bukaTgl+'T'+(a.bukaJam||'00:00'), t=(a.tutupTgl||a.bukaTgl)+'T'+(a.tutupJam||'23:59');
  return n<b ? 'belum' : (n>t ? 'tutup' : 'buka');
}
function jadwalAbsen(a){
  if(!a.bukaTgl) return 'Hari pertemuan saja';
  return fmtTgl(a.bukaTgl)+' '+(a.bukaJam||'00:00')+' – '+fmtTgl(a.tutupTgl||a.bukaTgl)+' '+(a.tutupJam||'23:59');
}
function badgeAbsen(a){
  const st=statusAbsen(a);
  return st==='buka' ? '<span class="badge b-ok">● Dibuka</span>' : st==='belum' ? '<span class="badge b-info">Dijadwalkan</span>' : '<span class="badge b-mute">Ditutup</span>';
}

function formTopik(){
  const k = S.user.role==='siswa'? kelasSiswa(S.user.id) : kelasGuru();
  let foto=null;
  const perbaruiPratinjau=()=>{
    const p=$('#t-fotoPreview'); if(!p) return;
    p.innerHTML = foto? `<img src="${foto}" style="max-height:160px;border-radius:9px;border:1px solid var(--border);display:block;margin-top:8px">
      <button class="btn btn-sm btn-danger" id="t-hapusFoto" style="margin-top:6px">Hapus Foto</button>` : '';
    const hf=$('#t-hapusFoto'); if(hf) hf.onclick=()=>{ foto=null; perbaruiPratinjau(); };
  };
  const tutup=modal({judul:'Buat Topik Diskusi', isi:`
    <div class="field"><label>Judul topik</label><input id="t-judul" type="text" placeholder="Contoh: Cara cepat memfaktorkan x² + bx + c"></div>
    <div class="field"><label>Isi pertanyaan atau pembahasan</label><textarea id="t-isi" style="min-height:120px"></textarea></div>
    <div class="field"><label>Lampiran foto (opsional)</label>
      <button type="button" class="btn btn-sm" id="t-kamera">📷 Ambil Foto (soal/materi yang dibahas)</button>
      <div id="t-fotoPreview"></div></div>
    <div id="t-err" style="color:var(--bad);font-size:12.5px;font-weight:600"></div>`,
    aksi:`<button class="btn" data-batal>Batal</button><button class="btn btn-primary" data-ok>Kirim</button>`});
  $('#t-kamera').onclick=()=> bukaKamera(d=>{ foto=d; perbaruiPratinjau(); });
  $('#modal-root [data-batal]').onclick=tutup;
  $('#modal-root [data-ok]').onclick=()=>{
    const judul=$('#t-judul').value.trim(), isi=$('#t-isi').value.trim();
    if(!judul||!isi){ $('#t-err').textContent='Judul dan isi wajib diisi.'; return; }
    const n={id:uid('d'),kelas:k?k.id:DB.kelas[0].id,judul,isi,penulis:S.user.id,tgl:today(),pin:false,balasan:[],foto};
    DB.diskusi.unshift(n); S.tmp.th=n.id; catat('Buat topik diskusi',judul);
    simpan(); tutup(); render(); toast('Topik diskusi dibuat.','ok');
  };
}

function rekapSiswa(sid){
  const nilai = Object.values(DB.kiriman).filter(x=>x.siswa===sid && x.nilaiAkhir!=null);
  const rata = nilai.length? Math.round(nilai.reduce((a,b)=>a+b.nilaiAkhir,0)/nilai.length):null;
  const ses = DB.absensi.filter(a=>a.data[sid]);
  const hadir = ses.length? Math.round(ses.filter(a=>a.data[sid]==='hadir').length/ses.length*100):0;
  return {nilai, rata, hadir, progres:progresSiswa(sid), umpan:DB.umpanBalik.filter(u=>u.siswa===sid)};
}

      </div></div>

}

function selisihHari(tgl){
  const a=new Date(today()+'T00:00:00'), b=new Date(tgl+'T00:00:00');
  return Math.round((b-a)/864e5);
}
function notifikasi(){
  if(!S.user) return [];
  const out=[], u=S.user;
  if(u.role==='siswa'){
    const k=kelasSiswa(u.id);
    [...DB.lkpd.filter(x=>x.terbit).map(x=>({t:'lkpd',x})),
     ...DB.latihan.filter(x=>x.terbit).map(x=>({t:'latihan',x})),
     ...DB.evaluasi.filter(x=>x.terbit).map(x=>({t:'evaluasi',x}))].forEach(({t,x})=>{
      const kk=getKiriman(u.id,t,x.id);
      if(kk && kk.status!=='draf') return;
      const sisa=selisihHari(x.tenggat);
      const terkunci = t!=='lkpd' && !cekSyarat(x,u.id).ok;
      if(terkunci) return;
      out.push({ic: sisa<0?'⏰':sisa<=2?'🔥':'📌',
        judul: sisa<0? 'Tenggat terlewat: '+x.judul : sisa<=2? 'Tenggat mepet: '+x.judul : 'Tugas baru: '+x.judul,
        isi: sisa<0? 'Terlambat '+Math.abs(sisa)+' hari. Segera kerjakan dan hubungi gurumu.'
             : sisa===0? 'Jatuh tempo hari ini.' : 'Tersisa '+sisa+' hari lagi (tenggat '+fmtTgl(x.tenggat)+').',
        tgl:x.tenggat, prioritas: sisa<=2, view:t, kelas:'b-warn'});
    });
    DB.pengumuman.filter(p=>!k||p.kelas===k.id).forEach(p=> out.push({
      ic:'📢', judul:'Pengumuman: '+p.judul, isi:p.isi.slice(0,110)+(p.isi.length>110?'…':''),
      tgl:p.tgl, prioritas:p.penting, view:'beranda', kelas:'b-info'}));
    DB.absensi.filter(a=>(!k||a.kelas===k.id) && statusAbsen(a)!=='belum').forEach(a=>{
      const st=a.data[u.id];
      if(!st) out.push({ic:'🗓️', judul:'Presensi belum tercatat', isi:'Pertemuan '+fmtTgl(a.tanggal)+' ('+a.topik+') belum memiliki status kehadiranmu.', tgl:a.tanggal, view:'absensi', kelas:'b-mute'});
      else if(st==='alpa') out.push({ic:'⚠️', judul:'Tercatat alpa', isi:'Pertemuan '+fmtTgl(a.tanggal)+' — hubungi gurumu bila ini keliru.', tgl:a.tanggal, prioritas:true, view:'absensi', kelas:'b-bad'});
    });
    DB.umpanBalik.filter(x=>x.siswa===u.id).forEach(x=> out.push({
      ic:'✉️', judul:'Umpan balik dari '+x.guru, isi:x.isi.slice(0,110), tgl:x.tgl, prioritas:true, view:'nilai', kelas:'b-brand'}));
    Object.values(DB.kiriman).filter(x=>x.siswa===u.id && x.status==='tervalidasi').forEach(x=>{
      const T=tesById(x.ref); if(!T) return;
      out.push({ic:'🏅', judul:'Nilai terbit: '+T.judul, isi:'Nilai akhirmu '+x.nilaiAkhir+'. Buka untuk melihat umpan balik per soal.',
        tgl:(x.waktuValidasi||x.waktu||'').slice(0,10), view:'nilai', kelas:'b-ok'});
    });
    Object.values(DB.kiriman).filter(x=>x.siswa===u.id && x.tipe==='lkpd' && x.penilaian && x.penilaian.status==='tervalidasi').forEach(x=>{
      const Lk=DB.lkpd.find(l=>l.id===x.ref); if(!Lk) return;
      out.push({ic:'🏅', judul:'Nilai LKPD terbit: '+Lk.judul, isi:'Nilai LKPD-mu '+x.penilaian.nilaiAkhir+'. Buka LKPD untuk melihat umpan balik gurumu.',
        tgl:(x.penilaian.waktuValidasi||'').slice(0,10), view:'lkpd', kelas:'b-ok'});
    });
  } else if(u.role==='guru'){
    Object.values(DB.kiriman).filter(x=>x.status==='terkirim'||x.status==='dikoreksi').forEach(x=>{
      const nama=userById(x.siswa)?.nama||'Siswa';
      const T = x.tipe==='lkpd'? DB.lkpd.find(l=>l.id===x.ref) : tesById(x.ref);
      if(!T) return;
      out.push({ic: x.status==='dikoreksi'?'✅':'📥',
        judul: x.status==='dikoreksi'? 'Menunggu validasi: '+nama : 'Jawaban masuk dari '+nama,
        isi:(x.status==='dikoreksi'? 'Koreksi AI selesai (skor '+x.skorAI+') pada ':'Mengumpulkan ')+T.judul,
        tgl:(x.waktu||'').slice(0,10), prioritas:x.status==='dikoreksi', view:x.tipe==='lkpd'?'lkpd':'validasi', kelas:'b-info'});
    });
    Object.values(DB.kiriman).filter(x=>x.pelanggaran&&x.pelanggaran.length).forEach(x=>{
      const T=tesById(x.ref);
      out.push({ic:'🚩', judul:'Indikasi kecurangan: '+(userById(x.siswa)?.nama||''),
        isi:x.pelanggaran.length+' pelanggaran mode fokus pada '+(T?T.judul:'kegiatan'),
        tgl:(x.waktu||'').slice(0,10), prioritas:true, view:'pemantauan', kelas:'b-bad'});
    });
    DB.diskusi.forEach(d=>{
      d.balasan.filter(b=>userById(b.penulis)?.role==='siswa').forEach(b=> out.push({
        ic:'💬', judul:'Balasan diskusi dari '+(userById(b.penulis)?.nama||''),
        isi:'Pada topik "'+d.judul+'": '+b.isi.slice(0,80), tgl:b.tgl, view:'diskusi', kelas:'b-brand'}));
      if(userById(d.penulis)?.role==='siswa') out.push({
        ic:'💬', judul:'Topik baru dari '+(userById(d.penulis)?.nama||''), isi:d.judul, tgl:d.tgl, view:'diskusi', kelas:'b-brand'});
    });
    DB.users.filter(x=>x.role==='siswa'&&x.masuk).slice(0,3).forEach(x=> out.push({
      ic:'👤', judul:x.nama+' masuk ke e-learning', isi:'Terakhir aktif '+new Date(x.masuk).toLocaleString('id-ID'),
      tgl:x.masuk.slice(0,10), view:'pemantauan', kelas:'b-mute'}));
  } else {
    DB.users.filter(x=>x.masuk).forEach(x=> out.push({
      ic:'👤', judul:x.nama+' masuk ('+x.role+')', isi:'Login ke-'+(x.jmlMasuk||1)+' · '+new Date(x.masuk).toLocaleString('id-ID'),
      tgl:x.masuk.slice(0,10), view:'akun', kelas:'b-mute'}));
    if(DB.users.some(x=>x.status==='nonaktif')) out.push({ic:'🔒', judul:'Ada akun nonaktif',
      isi:DB.users.filter(x=>x.status==='nonaktif').length+' akun tidak dapat masuk ke e-learning.', tgl:today(), view:'akun', kelas:'b-warn'});
  }
  return out.sort((a,b)=> (b.prioritas?1:0)-(a.prioritas?1:0) || String(b.tgl).localeCompare(String(a.tgl)));
}

function agenda(){
  const u=S.user, k = u.role==='siswa'? kelasSiswa(u.id) : kelasGuru();
  const out=[];
  DB.absensi.filter(a=>!k||a.kelas===k.id).forEach(a=> out.push({tgl:a.tanggal, ic:'🗓️', jenis:'Pertemuan', judul:a.topik, warna:'b-info', view:'absensi', id:a.id, tmpKey:'ab'}));
  DB.lkpd.filter(x=>x.terbit||u.role==='guru').filter(x=>!k||u.role==='guru'||x.kelas===k.id).forEach(x=> out.push({tgl:x.tenggat, ic:'🧩', jenis:'Tenggat LKPD', judul:x.judul, warna:'b-brand', view:'lkpd', id:x.id, tmpKey: u.role==='guru'?'lkpd':'lk'}));
  DB.latihan.filter(x=>x.terbit||u.role==='guru').filter(x=>!k||u.role==='guru'||x.kelas===k.id).forEach(x=> out.push({tgl:x.tenggat, ic:'✍️', jenis:'Tenggat Latihan', judul:x.judul, warna:'b-warn', view:'latihan', id:x.id, tmpKey: u.role==='guru'?'tes':'ts'}));
  DB.evaluasi.filter(x=>x.terbit||u.role==='guru').filter(x=>!k||u.role==='guru'||x.kelas===k.id).forEach(x=> out.push({tgl:x.tenggat, ic:'📝', jenis:'Evaluasi', judul:x.judul, warna:'b-bad', view:'evaluasi', id:x.id, tmpKey: u.role==='guru'?'tes':'ts'}));
  DB.pengumuman.filter(p=>!k||p.kelas===k.id).forEach(p=> out.push({tgl:p.tgl, ic:'📢', jenis:'Pengumuman', judul:p.judul, warna:'b-mute', view:u.role==='guru'?'pengumuman':'beranda', id:p.id, tmpKey:null}));
  return out.filter(x=>x.tgl).sort((a,b)=>a.tgl.localeCompare(b.tgl));
}
function vKalender(){

  const namaBulan=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const awal=new Date(th,bl,1), jmlHari=new Date(th,bl+1,0).getDate();
  const geser=(awal.getDay()+6)%7; // mulai Senin
  const kunci=(d)=> th+'-'+String(bl+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const hariIni=today();
  pasangView=()=>{
    $('#blPrev').onclick=()=>{ S.tmp.bulan=acuan-1; render(); };

    document.querySelectorAll('[data-ag]').forEach(b=> b.onclick=()=>{
      const v=b.dataset.ag, id=b.dataset.agid, tk=b.dataset.agtk;

      S.view=v; S.tmp={}; if(tk&&tk!=='null'&&id) S.tmp[tk]=id; render(); window.scrollTo(0,0);

  };
  const selTgl = S.tmp.hari;
  const sel = ag.filter(x=>x.tgl===selTgl);
  const mendatang = ag.filter(x=> x.tgl>=hariIni).slice(0,8);
  return `
  <div class="grid g-side">
    <div class="card">

          ${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div style="text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding-bottom:4px">${d}</div>`).join('')}
          ${Array(geser).fill('<div></div>').join('')}
          ${Array.from({length:jmlHari},(_,i)=>{
            const d=i+1, t=kunci(d), ev=ag.filter(x=>x.tgl===t);
            const ini=t===hariIni, aktif=t===selTgl;
            return `<button data-hari="${t}" style="min-height:62px;border-radius:10px;padding:5px;text-align:left;cursor:pointer;
              border:1px solid ${aktif?'var(--brand)':ini?'var(--ok)':'var(--border)'};
              background:${aktif?'var(--brand-soft)':ini?'var(--ok-soft)':'var(--surface-2)'}">
              <div style="font-size:12px;font-weight:${ini||aktif?'800':'600'};color:${ini?'var(--ok)':'var(--text-2)'}">${d}</div>
              <div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px">${ev.slice(0,3).map(e=>`<span style="font-size:10px">${e.ic}</span>`).join('')}
                ${ev.length>3?`<span style="font-size:9.5px;color:var(--text-3)">+${ev.length-3}</span>`:''}</div>
            </button>`;
          }).join('')}
        </div>
        ${selTgl? `<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:13px">
          <b style="font-size:13.5px">Agenda ${fmtTgl(selTgl)}</b>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:9px">
            ${sel.length? sel.map(x=>`<button class="toc-item" data-ag="${x.view}" data-agid="${esc(x.id||'')}" data-agtk="${x.tmpKey||''}" style="padding:11px;border:1px solid var(--border)">
              <span class="row" style="gap:7px"><span>${x.ic}</span><span class="badge ${x.warna}">${x.jenis}</span></span>
              <b style="display:block;margin-top:4px;font-size:13.3px">${esc(x.judul)}</b></button>`).join('')
              : '<div style="color:var(--text-3);font-size:13.2px">Tidak ada agenda pada tanggal ini.</div>'}
          </div></div>`:'<div style="margin-top:14px;font-size:12.5px;color:var(--text-3)">Klik salah satu tanggal untuk melihat agendanya.</div>'}
      </div>
    </div>
    <div class="card"><div class="card-head"><h3>Agenda Terdekat</h3></div>
      <div class="card-pad" style="display:flex;flex-direction:column;gap:8px">
        ${mendatang.length? mendatang.map(x=>{ const sisa=selisihHari(x.tgl);
          return `<button class="toc-item" data-ag="${x.view}" data-agid="${esc(x.id||'')}" data-agtk="${x.tmpKey||''}" style="padding:11px;border:1px solid var(--border)">
            <span class="row" style="gap:7px"><span>${x.ic}</span><span class="badge ${x.warna}">${x.jenis}</span>
              <span class="badge ${sisa<=2?'b-bad':'b-mute'}">${sisa===0?'Hari ini':sisa===1?'Besok':sisa+' hari lagi'}</span></span>
            <b style="display:block;margin-top:4px;font-size:13.2px">${esc(x.judul)}</b>
            <span style="font-size:11.5px;color:var(--text-3)">${fmtTgl(x.tgl)}</span></button>`;}).join('')
          : '<div class="empty" style="padding:20px">Belum ada agenda mendatang.</div>'}
      </div></div>
  </div>`;
}

async function unduh(namaFile, isi, mime){
  try{
    const dl = window.claude && claude.use? await claude.use('downloads') : null;
    if(dl){ await dl.save({filename:namaFile, data:isi}); toast('Berkas disiapkan untuk diunduh.','ok'); return; }
  }catch(e){}
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([isi],{type:mime||'text/plain;charset=utf-8'}));
    a.download=namaFile; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast('Berkas '+namaFile+' diunduh.','ok');
  }catch(e){ toast('Peramban menolak unduhan. Gunakan tombol cetak sebagai gantinya.','warn'); }
}
function csvAman(v){ const t=String(v==null?'':v); return /[";\n]/.test(t)? '"'+t.replace(/"/g,'""')+'"' : t; }
function csvKelas(){
  const k=kelasGuru(), sw=siswaKelas(k.id);
  const keg=[...DB.latihan,...DB.evaluasi];
  const head=['Nama','NIS','Kelas',...keg.map(t=>t.judul),'Rata-rata','Ketuntasan','Kehadiran (%)','Progres (%)'];
  const baris=sw.map(su=>{ const r=rekapSiswa(su.id);
    return [su.nama,su.nip,k.nama,
      ...keg.map(t=>{ const kk=getKiriman(su.id,t.jenis,t.id); return kk&&kk.nilaiAkhir!=null? kk.nilaiAkhir : ''; }),
      r.rata??'', r.rata==null?'Belum ada nilai':(r.rata>=75?'Tuntas':'Belum tuntas'), r.hadir, r.progres.persen];
  });
  return '\uFEFF'+[head,...baris].map(b=>b.map(csvAman).join(';')).join('\n');
}

</body></html>`;

function formTes(id, jenisBaru){
  const T = id? tesById(id) : null;
  let soal = T? JSON.parse(JSON.stringify(T.soal)) : [{id:uid('s'),tipe:'isian',teks:'',kunci:'',alt:[],skor:20,petunjuk:''}];
  const jenis = T? T.jenis : (jenisBaru||'latihan');
  const gambar = ()=>{
    $('#soalWrap').innerHTML = soal.map((s,i)=>`
      <div style="border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;background:var(--surface-2)">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="q-num">Soal ${i+1}</span>
          <div class="row" style="gap:5px">
            <select class="s-tipe" data-i="${i}" style="width:118px">
              ${[['isian','Isian singkat'],['pg','Pilihan ganda'],['uraian','Esai / uraian'],['foto','Foto jawaban']].map(([v,t])=>`<option value="${v}" ${s.tipe===v?'selected':''}>${t}</option>`).join('')}
            </select>
            <input class="s-skor" data-i="${i}" type="number" value="${s.skor}" min="1" style="width:74px" title="Bobot skor">
            <button class="btn btn-sm btn-danger" data-hs="${i}">✕</button>
          </div></div>
        <div class="field" style="margin-bottom:9px"><label>Pertanyaan</label>
          <textarea class="s-teks" data-i="${i}" style="min-height:58px" placeholder="Tulis soal, contoh: Sederhanakan 7a + 3b − 2a + 5b">${esc(s.teks)}</textarea></div>
        ${s.tipe==='pg'? `<div class="field" style="margin-bottom:9px"><label>Pilihan jawaban (satu per baris)</label>
            <textarea class="s-opsi" data-i="${i}" style="min-height:70px">${esc((s.opsi||[]).join('\n'))}</textarea></div>`:''}
        ${s.tipe==='foto'? `<div class="callout tip" style="margin:0 0 9px">Soal ini dijawab siswa dengan <b>memotret pekerjaan tulisan tangan</b>. Tidak perlu kunci jawaban — nilai ditentukan langsung oleh guru saat validasi.</div>` : `
        <div class="grid g2" style="gap:0 12px">
          <div class="field" style="margin-bottom:0"><label>Kunci jawaban</label>
            <input class="s-kunci" data-i="${i}" type="text" value="${esc(s.kunci||'')}" placeholder="${s.tipe==='pg'?'Salin persis salah satu pilihan':'Contoh: 5a+8b'}"></div>
          <div class="field" style="margin-bottom:0"><label>${s.tipe==='uraian'?'Unsur kunci penilaian (pisahkan koma)':'Jawaban alternatif (pisahkan koma)'}</label>
            <input class="s-alt" data-i="${i}" type="text" value="${esc((s.tipe==='uraian'?(s.kataKunci||[]):(s.alt||[])).join(', '))}"></div>
        </div>`}
        <div class="field" style="margin:9px 0 0"><label>Petunjuk untuk siswa (opsional)</label>
          <input class="s-hint" data-i="${i}" type="text" value="${esc(s.petunjuk||'')}"></div>
      </div>`).join('');
    ikat();
  };
  const serap = ()=>{
    document.querySelectorAll('.s-teks').forEach(e=> soal[+e.dataset.i].teks=e.value);
    document.querySelectorAll('.s-kunci').forEach(e=> soal[+e.dataset.i].kunci=e.value.trim());
    document.querySelectorAll('.s-skor').forEach(e=> soal[+e.dataset.i].skor=+e.value||1);
    document.querySelectorAll('.s-hint').forEach(e=> soal[+e.dataset.i].petunjuk=e.value.trim());
    document.querySelectorAll('.s-opsi').forEach(e=> soal[+e.dataset.i].opsi=e.value.split('\n').map(x=>x.trim()).filter(Boolean));
    document.querySelectorAll('.s-alt').forEach(e=>{ const s=soal[+e.dataset.i], arr=e.value.split(',').map(x=>x.trim()).filter(Boolean);
      if(s.tipe==='uraian') s.kataKunci=arr; else s.alt=arr; });
  };
  const ikat = ()=>{
    document.querySelectorAll('.s-tipe').forEach(e=> e.onchange=()=>{ serap(); soal[+e.dataset.i].tipe=e.value; gambar(); });
    document.querySelectorAll('[data-hs]').forEach(b=> b.onclick=()=>{ serap(); if(soal.length<2){ toast('Minimal satu soal.','warn'); return; } soal.splice(+b.dataset.hs,1); gambar(); });
  };
  const tutup = modal({judul: id?'Ubah Soal — '+T.judul : 'Buat '+(jenis==='evaluasi'?'Evaluasi':'Latihan')+' Baru', lebar:true, isi:`
    <div class="field"><label>Judul</label><input id="T-judul" type="text" value="${esc(T?T.judul:'')}" placeholder="Latihan 3 — Persamaan Linear Satu Variabel"></div>
    <div class="grid g3" style="gap:0 12px">
      <div class="field"><label>Jenis</label><select id="T-jenis">
        <option value="latihan" ${jenis==='latihan'?'selected':''}>Latihan</option>
        <option value="evaluasi" ${jenis==='evaluasi'?'selected':''}>Evaluasi</option></select></div>
      <div class="field"><label>Kelas</label><select id="T-kelas">${DB.kelas.map(k=>`<option value="${k.id}" ${T&&T.kelas===k.id?'selected':''}>${esc(k.nama)}</option>`).join('')}</select></div>
      <div class="field"><label>Tenggat</label><input id="T-tenggat" type="text" value="${esc(T?T.tenggat:today())}"></div>
    </div>
    <div class="field"><label>Batas waktu pengerjaan (menit)</label>
      <input id="T-durasi" type="number" min="0" max="240" value="${T&&T.durasi?T.durasi:0}">
      <span class="hint">Isi 0 bila tanpa batas waktu. Bila diisi, pewaktu mundur tampil di layar siswa dan jawaban terkirim otomatis saat habis.</span></div>
    <div class="grid g2" style="gap:0 14px">
      <div class="field"><label>Boleh dikerjakan mulai pukul</label><input id="T-jamMulai" type="time" value="${T&&T.jamMulai?T.jamMulai:'00:00'}"></div>
      <div class="field"><label>Sampai pukul</label><input id="T-jamSelesai" type="time" value="${T&&T.jamSelesai?T.jamSelesai:'23:59'}"></div>
    </div>
    <div class="hint" style="margin:-8px 0 12px">Berlaku setiap hari sampai tenggat. Biarkan 00:00–23:59 bila tidak ingin membatasi jam. Setelah tanggal tenggat terlewat, kegiatan otomatis terkunci untuk siswa.</div>
    <div class="row" style="justify-content:space-between;margin:6px 0 10px">
      <b style="font-size:13px">DAFTAR SOAL</b>
      <div class="row" style="gap:6px"><span class="badge b-brand" id="totalSkor">Total 0 poin</span>
        <button class="btn btn-sm" id="tambahSoal">+ Tambah Soal</button></div></div>
    <div id="soalWrap"></div>
    <div id="T-err" style="color:var(--bad);font-size:12.5px;font-weight:600"></div>`,
    aksi:`<button class="btn" data-batal>Batal</button><button class="btn btn-primary" data-ok>${id?'Perbarui':'Simpan'}</button>`});
  gambar();
  const hitung=()=>{ serap(); $('#totalSkor').textContent='Total '+soal.reduce((a,b)=>a+b.skor,0)+' poin'; };
  hitung();
  $('#tambahSoal').onclick=()=>{ serap(); soal.push({id:uid('s'),tipe:'isian',teks:'',kunci:'',alt:[],skor:20,petunjuk:''}); gambar(); hitung(); };
  $('#modal-root [data-batal]').onclick=tutup;
  $('#modal-root [data-ok]').onclick=()=>{
    serap();
    const judul=$('#T-judul').value.trim();
    if(!judul){ $('#T-err').textContent='Judul wajib diisi.'; return; }
    if(soal.some(s=>!s.teks.trim())){ $('#T-err').textContent='Setiap soal harus memiliki teks pertanyaan.'; return; }
    if(soal.some(s=>s.tipe!=='foto' && !s.kunci)){ $('#T-err').textContent='Setiap soal (kecuali tipe foto jawaban) harus memiliki kunci jawaban.'; return; }
    if(soal.some(s=>s.tipe==='pg' && (!s.opsi||s.opsi.length<2))){ $('#T-err').textContent='Soal pilihan ganda memerlukan minimal 2 pilihan jawaban.'; return; }
    soal.forEach(s=>{ if(s.tipe==='foto' && !s.kunci) s.kunci='(dinilai manual dari foto)'; });
    const jn=$('#T-jenis').value;
    const data={judul, kelas:$('#T-kelas').value, tenggat:$('#T-tenggat').value.trim(), jenis:jn, durasi:+$('#T-durasi').value||0, soal};
    if(id){
      const lamaDiEval = DB.evaluasi.some(x=>x.id===id);
      DB.latihan=DB.latihan.filter(x=>x.id!==id); DB.evaluasi=DB.evaluasi.filter(x=>x.id!==id);
      const obj=Object.assign({id, terbit:T.terbit, syarat:T.syarat||null, awas:T.awas!==false}, data);
      (jn==='evaluasi'?DB.evaluasi:DB.latihan).push(obj);
    } else {
      const obj=Object.assign({id:uid(jn==='evaluasi'?'e':'t'), terbit:false, syarat:null, awas:true}, data);
      (jn==='evaluasi'?DB.evaluasi:DB.latihan).push(obj); S.tmp.tes=obj.id;
    }
    catat(id?'Ubah soal':'Buat '+jn, judul); simpan(); tutup(); render(); toast('Soal tersimpan.','ok');
  };
}

function contohKiriman(){
  const set=(sid,tipe,ref,jawaban,status)=>{ const key=kKey(sid,tipe,ref);
    DB.kiriman[key]={siswa:sid,tipe,ref,key,jawaban,status,waktu:new Date(Date.now()-864e5).toISOString(),skorAI:null,nilaiAkhir:null}; };
  set('u-s1','latihan','t-1',{s1:'5a + 8b', s2:'-4', s3:'−2xy', s4:'9x-5', s5:'6x+15'},'terkirim');

  set('u-s3','latihan','t-1',{s1:'5a+8b', s2:'-4', s3:'6x', s4:'9x-5', s5:'6x+5'},'terkirim');
  set('u-s1','lkpd','l-1',{
    orientasi:'Menurut saya karena pensil dan spidol itu barang yang berbeda, jadi tidak bisa dijumlahkan langsung. Kalau digabung nanti bingung yang dihitung apa.',
    eksplorasi:'Kelompok 1: 4x, -2x, x. Kelompok 2: 7y, 9y, -5y. Dasarnya saya kelompokkan berdasarkan hurufnya sama atau tidak.',
    konstruksi:'Dua suku disebut sejenis apabila hurufnya sama dan pangkatnya juga sama. Hasilnya 4x + 7y - 2x + 9y = 2x + 16y.',
    presentasi:'Teman saya menulis "variabelnya sama" sedangkan saya menulis "hurufnya sama". Kami sepakat memakai kata variabel karena itu istilah yang benar.',
    refleksi:'1) Saya paham cara menggabungkan suku sejenis. 2) Masih bingung kalau ada pangkat dua. 3) Contoh: 6m + 2m = 8m.'},'terkirim');
  set('u-s2','lkpd','l-1',{orientasi:'Karena barangnya beda jenis.', eksplorasi:'4x, -2x, x dan 7y, 9y, -5y'},'draf');
}
